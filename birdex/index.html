<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Birdex — a birding pokédex</title>
  <meta name="description" content="A birding dex: photograph birds, unlock entries, build collections, read where each species lives, and see how rare it is where you are standing." />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#f4f1e8" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#14171a" media="(prefers-color-scheme: dark)" />
  <meta name="app-version" content="1.0.0" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Birdex" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="app">
  <noscript><p style="padding:20px">Birdex needs JavaScript: the dex, your photos and the rarity model all run in the browser.</p></noscript>
</div>

<script src="js/core.js"></script>
<script src="js/species-songbirds.js"></script>
<script src="js/species-migrants.js"></script>
<script src="js/species-water-raptors.js"></script>
<script src="js/species-world.js"></script>
<script src="js/art.js"></script>
<script src="js/store.js"></script>
<script src="js/photos.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
<script>
  Birdex.app.boot().catch(function (err) {
    console.error(err);
    // The usual causes are a private window and, for a file opened straight
    // from disk, a browser that refuses storage to file:// pages (Safari).
    var local = location.protocol === 'file:';
    document.getElementById('app').innerHTML =
      '<div style="padding:24px;max-width:560px;margin:0 auto;line-height:1.5">' +
      '<h1>Birdex could not start</h1>' +
      '<p style="color:#888">It could not open browser storage, so there is nowhere to keep your photos.</p>' +
      (local
        ? '<p style="color:#888">This copy was opened directly from a file. Chrome, Edge and Firefox allow that; ' +
          'Safari does not. Either open this file in one of those, or serve the folder — ' +
          '<code>python3 -m http.server 8000</code> — and visit <code>localhost:8000</code>.</p>'
        : '<p style="color:#888">Private windows often block IndexedDB. Try an ordinary window.</p>') +
      '<pre style="white-space:pre-wrap;font-size:12px;color:#888">' + String(err && err.message || err) + '</pre></div>';
  });

  // PWA: usable offline once visited. Skipped over file://.
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
