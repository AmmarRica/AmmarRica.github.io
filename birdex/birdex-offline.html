  }

  function shortName(speciesId) {
    const sp = Birdex.get(speciesId);
    return sp ? sp.n : 'Unknown';
  }

  function viewCollection(state) {
    const app = App();
    const c = state.collections.find(x => x.id === state.route.params.id);
    if (!c) return empty('Collection missing', 'It may have been deleted.');
    const photos = c.photoIds.map(id => app.photo(id)).filter(Boolean);

    return '<section class="pane">' +
      '<div class="title-row">' +
        '<h1>' + esc(c.name) + '</h1>' +
      '</div>' +
      '<label class="field"><span>Name</span>' +
        '<input id="colName" type="text" value="' + esc(c.name) + '" data-on="collection-name" data-id="' + c.id + '"></label>' +
      '<div class="actions">' +
        '<button class="btn primary" data-act="sheet-add-photos" data-id="' + c.id + '">Add photos</button>' +
        '<button class="btn danger" data-act="delete-collection" data-id="' + c.id + '">Delete collection</button>' +
      '</div>' +
      (photos.length
        ? '<div class="photogrid">' + photos.map(p =>
            '<div class="ph pick">' +
              '<button class="ph-open" data-act="go" data-href="#/photo/' + p.id + '">' +
                '<img src="' + Birdex.store.url(p, 'thumb') + '" alt="" loading="lazy"></button>' +
              '<span>' + esc(shortName(p.speciesId)) + '</span>' +
              '<button class="ph-x" data-act="toggle-collection" data-collection="' + c.id + '" data-photo="' + p.id +
                '" aria-label="Remove from collection">×</button>' +
              '<button class="ph-cover' + (c.cover === p.id ? ' on' : '') + '" data-act="set-cover" data-collection="' +
                c.id + '" data-photo="' + p.id + '" aria-label="Use as cover">' + icon('star') + '</button>' +
            '</div>').join('') + '</div>'
        : empty('Empty collection', 'Add photos from your sightings to fill it.')) +
      '</section>';
  }

  function viewPhoto(state) {
    const app = App();
    const p = app.photo(state.route.params.id);
    if (!p) return empty('Photo missing', 'It may have been deleted.');
    const sp = Birdex.get(p.speciesId);
    const sighting = state.sightings.find(s => s.id === p.sightingId);
    const isDex = state.dexPhotos[p.speciesId] === p.id;

    return '<section class="pane">' +
      '<div class="lightbox"><img src="' + Birdex.store.url(p, 'full') + '" alt="Photo of ' + esc(sp ? sp.n : '') + '"></div>' +
      '<div class="title-row"><div>' +
        '<h1>' + esc(sp ? sp.n : 'Unknown') + '</h1>' +
        '<p class="muted small">' + Birdex.fmtDate(p.ts) + ' · ' + Birdex.fmtTime(p.ts) +
          (sighting && sighting.region ? ' · ' + esc(Birdex.region(sighting.region).name) : '') + '</p>' +
      '</div></div>' +
      (sighting && sighting.notes ? '<p class="quote">' + esc(sighting.notes) + '</p>' : '') +
      '<div class="actions">' +
        (sp ? '<button class="btn" data-act="go" data-href="#/species/' + sp.id + '">Dex entry</button>' : '') +
        '<button class="btn" data-act="add-to-collection" data-photo="' + p.id + '">Add to collection</button>' +
        '<button class="btn' + (isDex ? ' on' : '') + '" data-act="set-dexphoto" data-species="' + p.speciesId +
          '" data-photo="' + p.id + '">' + (isDex ? 'Dex photo ✓' : 'Use as dex photo') + '</button>' +
        '<button class="btn danger" data-act="delete-photo" data-id="' + p.id + '">' + icon('trash') + ' Delete</button>' +
      '</div>' +
      '</section>';
  }

  /* ------------------------------------------------------------------ */
  /* History                                                             */
  /* ------------------------------------------------------------------ */

  function viewHistory(state) {
    const app = App();
    const s = app.stats();
    const rank = Birdex.rankFor(s.points);
    const badges = app.earnedBadges();

    /* Last 12 months of activity. */
    const now = new Date();
    const buckets = [];
    for (let i = 11; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      buckets.push({ key: d.getFullYear() + '-' + d.getMonth(), label: d.toLocaleDateString(undefined, { month: 'narrow' }), n: 0 });
    }
    const index = {};
    buckets.forEach((b, i) => { index[b.key] = i; });
    for (const sg of state.sightings) {
      const d = new Date(sg.ts);
      const k = d.getFullYear() + '-' + d.getMonth();
      if (index[k] != null) buckets[index[k]].n++;
    }
    const peak = Math.max(1, ...buckets.map(b => b.n));

    /* Timeline grouped by day. */
    const days = [];
    let cur = null;
    for (const sg of state.sightings) {
      const key = Birdex.fmtDayKey(sg.ts);
      if (!cur || cur.key !== key) { cur = { key, ts: sg.ts, items: [] }; days.push(cur); }
      cur.items.push(sg);
    }

    return '<section class="pane">' +
      '<h1>History</h1>' +

      '<div class="tiles">' +
        tile(s.species, 'species') + tile(s.sightings, 'sightings') +
        tile(s.photos, 'photos') + tile(s.points, 'dex points') +
      '</div>' +

      '<div class="panel">' +
        '<h2>' + esc(rank.rank.name) + '</h2>' +
        '<div class="progress"><div style="width:' + (rank.progress * 100).toFixed(1) + '%"></div></div>' +
        '<p class="muted small">' + (rank.next
          ? (rank.next.min - s.points) + ' points to ' + esc(rank.next.name)
          : 'Top rank reached.') + '</p>' +
      '</div>' +

      '<div class="panel">' +
        '<h2>Last 12 months</h2>' +
        '<div class="bars">' + buckets.map(b =>
          '<div class="bar"><em>' + (b.n || '') + '</em>' +
            '<i style="height:' + Math.max(3, b.n / peak * 100) + '%"' + (b.n ? ' class="on"' : '') + '></i>' +
            '<span>' + esc(b.label) + '</span></div>').join('') + '</div>' +
      '</div>' +

      '<div class="panel">' +
        '<h2>Badges <em class="muted">' + badges.filter(b => b.earned).length + ' / ' + badges.length + '</em></h2>' +
        '<div class="badges">' + badges.map(b =>
          '<div class="badge' + (b.earned ? ' on' : '') + '"><b>' + esc(b.badge.name) + '</b>' +
          '<span>' + esc(b.badge.desc) + '</span></div>').join('') + '</div>' +
      '</div>' +

      '<div class="panel">' +
        '<h2>Birding history</h2>' +
        (days.length
          ? days.map(d =>
              '<div class="day"><h3>' + Birdex.fmtDate(d.ts) + ' <em>' + d.items.length + '</em></h3>' +
              '<ul class="rows compact">' + d.items.map(sg => sightingRow(sg, app)).join('') + '</ul></div>').join('')
          : empty('No sightings yet', 'Your birding history builds itself as you log.',
              '<button class="btn primary" data-act="go" data-href="#/log">Log your first bird</button>')) +
      '</div>' +

      '<div class="actions"><button class="btn" data-act="go" data-href="#/settings">Settings and data</button></div>' +
      '</section>';
  }

  function tile(n, label) {
    return '<div class="tile"><b>' + n + '</b><span>' + esc(label) + '</span></div>';
  }

  function sightingRow(sg, app) {
    const sp = Birdex.get(sg.speciesId);
    const photo = sg.photoIds && sg.photoIds.length ? app.photo(sg.photoIds[0]) : null;
    return '<li><button class="row" data-act="go" data-href="#/sighting/' + sg.id + '">' +
      '<span class="row-art">' + (photo
        ? '<img class="thumb-img" src="' + Birdex.store.url(photo, 'thumb') + '" alt="" loading="lazy">'
        : (sp ? Birdex.art.portrait(sp, { reveal: true }) : '')) + '</span>' +
      '<span class="row-main">' +
        '<span class="row-name">' + esc(sp ? sp.n : 'Unknown') + (sg.count > 1 ? ' ×' + sg.count : '') + '</span>' +
        '<span class="row-sub">' + Birdex.fmtTime(sg.ts) +
          (sg.region ? ' · ' + esc(Birdex.region(sg.region).name) : '') +
          (sg.notes ? ' · ' + esc(sg.notes.slice(0, 40)) : '') + '</span>' +
      '</span>' +
      '</button></li>';
  }

  function viewSighting(state) {
    const app = App();
    const sg = state.sightings.find(x => x.id === state.route.params.id);
    if (!sg) return empty('Sighting missing', 'It may have been deleted.');
    const sp = Birdex.get(sg.speciesId);
    const photos = (sg.photoIds || []).map(id => app.photo(id)).filter(Boolean);
    const rarity = sg.region ? Birdex.rarity(sp, sg.region, new Date(sg.ts).getMonth() + 1) : null;

    return '<section class="pane">' +
      '<h1>' + esc(sp ? sp.n : 'Unknown') + '</h1>' +
      '<p class="muted">' + Birdex.fmtDate(sg.ts) + ' · ' + Birdex.fmtTime(sg.ts) +
        (sg.region ? ' · ' + esc(Birdex.region(sg.region).name) : ' · no location') + '</p>' +
      (photos.length
        ? '<div class="strip big">' + photos.map(p =>
            '<button class="strip-item" data-act="go" data-href="#/photo/' + p.id + '">' +
            '<img src="' + Birdex.store.url(p, 'thumb') + '" alt="" loading="lazy"></button>').join('') + '</div>'
        : '') +
      '<div class="panel">' +
        '<p class="stat-line"><b>' + sg.count + '</b> bird' + (sg.count > 1 ? 's' : '') +
          (rarity ? ' · ' + esc(rarity.label) + ' there that month' : '') + '</p>' +
        (sg.notes ? '<p class="quote">' + esc(sg.notes) + '</p>' : '<p class="muted">No notes.</p>') +
        (sg.lat != null ? '<p class="muted small">' + sg.lat.toFixed(4) + ', ' + sg.lng.toFixed(4) +
          (sg.acc ? ' · ±' + Math.round(sg.acc) + ' m' : '') + '</p>' : '') +
      '</div>' +
      '<div class="actions">' +
        (sp ? '<button class="btn" data-act="go" data-href="#/species/' + sp.id + '">Dex entry</button>' : '') +
        '<button class="btn danger" data-act="delete-sighting" data-id="' + sg.id + '">' + icon('trash') + ' Delete sighting</button>' +
      '</div>' +
      '</section>';
  }

  /* ------------------------------------------------------------------ */
  /* Settings                                                            */
  /* ------------------------------------------------------------------ */

  function viewSettings(state) {
    return '<section class="pane">' +
      '<h1>Settings and data</h1>' +

      (global.BIRDEX_OFFLINE ? '' : installPanel(state)) +

      '<div class="panel">' +
        '<h2>Storage</h2>' +
        '<p class="muted" id="storageLine">' + (state.storage
          ? fmtBytes(state.storage.usage) + ' used of about ' + fmtBytes(state.storage.quota) + ' available'
          : (state.storage === false ? 'This browser does not report a storage estimate.' : 'Checking…')) + '</p>' +
        '<p class="muted small">Photos are re-encoded to about 1600 px on import, so a few hundred birds fit comfortably.</p>' +
      '</div>' +

      '<div class="panel">' +
        '<h2>Offline copy</h2>' +
        (global.BIRDEX_OFFLINE
          ? '<p class="muted">You are running the offline copy. Everything — all ' + Birdex.count() +
              ' dex entries, the rarity model, your photos — is already on this device, and it works with no ' +
              'network at all. To move it to another machine, just copy the .html file across; your sightings ' +
              'stay behind on this one, so export a backup first if you want them too.</p>'
          : '<p class="muted">Download Birdex as a single self-contained file. Open it from your desktop and the ' +
              'whole app runs locally — no server, no install, no network.</p>' +
            '<div class="actions">' +
              '<a class="btn primary" href="birdex-offline.html" download="birdex-offline.html">Download Birdex</a>' +
            '</div>' +
            '<p class="muted small">Sightings saved in the downloaded copy are separate from the ones saved here: ' +
              'a browser keeps storage for local files apart from storage for websites.</p>') +
      '</div>' +

      '<div class="panel">' +
        '<h2>Backup</h2>' +
        '<p class="muted">Export your sightings, notes and collection lists as JSON. Photo files are not included — they stay in this browser only.</p>' +
        '<div class="actions"><button class="btn" data-act="export">Export JSON</button></div>' +
      '</div>' +

      '<div class="panel">' +
        '<h2>About the rarity data</h2>' +
        '<p class="muted">Birdex carries ' + Birdex.count() + ' species across ' + Birdex.regions.length +
        ' birding regions. Abundance is a hand-built 0–5 scale per region, adjusted for the season, in the tradition of a ' +
        'field guide\'s status bars. It is a guide to what is likely, not a substitute for local checklists.</p>' +
        '<p class="muted small">Coverage is deepest in North America, where every region carries 160 to 310 species. ' +
        'The European regions hold the widespread residents and visitors rather than a complete list, so treat a thin ' +
        'regional list as a gap in the data, not an empty landscape.</p>' +
      '</div>' +

      '<div class="panel danger-zone">' +
        '<h2>Erase everything</h2>' +
        '<p class="muted">Deletes every sighting, photo and collection on this device. There is no undo.</p>' +
        '<div class="actions"><button class="btn danger" data-act="wipe">Erase all data</button></div>' +
      '</div>' +
      '</section>';
  }

  /* ------------------------------------------------------------------ */
  /* Install as an app                                                   */
  /* ------------------------------------------------------------------ */

  function installPanel(state) {
    const app = App();
    const ins = app.install;

    if (ins.isInstalled()) {
      return '<div class="panel">' +
        '<h2>Installed</h2>' +
        '<p class="muted">Birdex is installed on this device. It has its own icon, opens in its own window, ' +
        'and all ' + Birdex.count() + ' dex entries work with no signal at all — which is the point, since the ' +
        'places worth birding rarely have any.</p>' +
        '</div>';
    }

    const how = {
      ios: '<ol class="steps">' +
        '<li>Tap the <b>Share</b> button in Safari — the square with an arrow.</li>' +
        '<li>Scroll down and choose <b>Add to Home Screen</b>.</li>' +
        '<li>Tap <b>Add</b>.</li></ol>' +
        '<p class="muted small">It has to be Safari — on iOS, Chrome and Firefox cannot install web apps. ' +
        'Installing also protects your sightings: Safari clears storage for sites you have not opened in a while, ' +
        'but leaves installed apps alone.</p>',
      android: '<p class="muted">Open the browser menu (⋮) and choose <b>Install app</b> or <b>Add to Home screen</b>.</p>',
      desktop: '<p class="muted">In Chrome or Edge, click the install icon at the right-hand end of the address bar, ' +
        'or open the browser menu and choose <b>Install Birdex</b>.</p>'
    }[ins.platform()];

    return '<div class="panel">' +
      '<h2>Install as an app</h2>' +
      '<p class="muted">Put Birdex on your home screen: its own icon, its own window, no browser chrome, ' +
      'and it runs with no network at all once installed.</p>' +
      (ins.canPrompt()
        ? '<div class="actions"><button class="btn primary" data-act="install">Install Birdex</button></div>' +
          '<p class="muted small">Or add it from your browser menu.</p>'
        : how) +
      '</div>';
  }

  /** A quiet nudge on the dex, since nobody goes looking in Settings. */
  function installBanner(state) {
    const ins = App().install;
    if (global.BIRDEX_OFFLINE || state.installDismissed || ins.isInstalled()) return '';
    if (!ins.canPrompt() && ins.platform() !== 'ios') return '';
    return '<div class="install-banner">' +
      '<div><b>Take Birdex birding</b>' +
      '<span>Install it and the whole dex works with no signal.</span></div>' +
      '<div class="install-banner-actions">' +
        (ins.canPrompt()
          ? '<button class="btn small primary" data-act="install">Install</button>'
          : '<button class="btn small primary" data-act="go" data-href="#/settings">How</button>') +
        '<button class="btn small" data-act="dismiss-install" aria-label="Dismiss">✕</button>' +
      '</div></div>';
  }

  function fmtBytes(n) {
    if (!n && n !== 0) return 'unknown';
    if (n > 1e9) return (n / 1e9).toFixed(1) + ' GB';
    if (n > 1e6) return (n / 1e6).toFixed(1) + ' MB';
    if (n > 1e3) return (n / 1e3).toFixed(0) + ' kB';
    return n + ' B';
  }

  /* ------------------------------------------------------------------ */
  /* Bottom sheet                                                        */
  /* ------------------------------------------------------------------ */

  function renderSheet(state) {
    const app = App();
    const sheet = state.sheet;
    let inner = '';

    if (sheet.type === 'collections') {
      inner = '<h2>Add to collection</h2>' +
        (state.collections.length
          ? '<ul class="sheet-list">' + state.collections.map(c => {
              const inIt = c.photoIds.indexOf(sheet.photoId) !== -1;
              return '<li><button class="sheet-row' + (inIt ? ' on' : '') + '" data-act="toggle-collection" data-collection="' +
                c.id + '" data-photo="' + sheet.photoId + '">' +
                '<span>' + esc(c.name) + '</span><em>' + (inIt ? 'Added ✓' : 'Add') + '</em></button></li>';
            }).join('') + '</ul>'
          : '<p class="muted">You have no collections yet.</p>') +
        '<div class="actions"><button class="btn" data-act="new-collection" data-photo="' + sheet.photoId + '">New collection</button></div>';
    }

    if (sheet.type === 'dexphoto') {
      const photos = app.photosFor(sheet.speciesId);
      inner = '<h2>Choose the dex photo</h2>' +
        '<div class="photogrid">' + photos.map(p =>
          '<button class="ph" data-act="set-dexphoto" data-species="' + sheet.speciesId + '" data-photo="' + p.id + '">' +
            '<img src="' + Birdex.store.url(p, 'thumb') + '" alt="" loading="lazy">' +
            '<span>' + Birdex.fmtDate(p.ts) + '</span></button>').join('') + '</div>';
    }

    if (sheet.type === 'addphotos') {
      const c = state.collections.find(x => x.id === sheet.collectionId);
      inner = '<h2>Add photos to ' + esc(c ? c.name : '') + '</h2>' +
        (state.photos.length
          ? '<div class="photogrid">' + state.photos.map(p => {
              const inIt = c && c.photoIds.indexOf(p.id) !== -1;
              return '<button class="ph' + (inIt ? ' on' : '') + '" data-act="toggle-collection" data-collection="' +
                sheet.collectionId + '" data-photo="' + p.id + '">' +
                '<img src="' + Birdex.store.url(p, 'thumb') + '" alt="" loading="lazy">' +
                '<span>' + esc(shortName(p.speciesId)) + (inIt ? ' ✓' : '') + '</span></button>';
            }).join('') + '</div>'
          : '<p class="muted">No photos yet.</p>');
    }

    return '<div class="sheet-back" data-act="close-sheet"></div>' +
      '<div class="sheet" role="dialog" aria-modal="true">' + inner +
      '<button class="btn wide" data-act="close-sheet">Done</button></div>';
  }

  /* ------------------------------------------------------------------ */
  /* Events                                                              */
  /* ------------------------------------------------------------------ */

  function onClick(e) {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const app = App();
    const state = app.state;
    const d = el.dataset;

    switch (d.act) {
      case 'go': app.go(d.href); break;
      case 'back': app.back(); break;

      case 'dex-filter': state.dexFilter = d.value; app.render(); break;
      case 'nearby-filter': state.nearbyFilter = d.value; app.render(); break;

      case 'locate': app.locate({ fresh: true, precise: true }); break;

      case 'pick-species':
        state.pending.speciesId = d.id;
        state.pending.query = '';
        app.render();
        break;
      case 'clear-species':
        state.pending.speciesId = null;
        app.render();
        break;
      case 'log-species':
        state.pending.speciesId = d.id;
        app.go('#/log');
        break;
      case 'remove-pending': app.removePendingPhoto(parseInt(d.index, 10)); break;
      case 'save-sighting': app.saveSighting(); break;

      case 'delete-sighting':
        if (confirm('Delete this sighting and its photos?')) {
          app.deleteSighting(d.id).then(() => app.go('#/history'));
        }
        break;
      case 'delete-photo':
        if (confirm('Delete this photo?')) app.deletePhoto(d.id).then(() => app.back());
        break;

      case 'set-dexphoto':
        app.setDexPhoto(d.species, d.photo).then(() => { state.sheet = null; app.render(); });
        break;
      case 'sheet-dexphoto':
        state.sheet = { type: 'dexphoto', speciesId: d.id };
        app.render();
        break;
      case 'add-to-collection':
        state.sheet = { type: 'collections', photoId: d.photo };
        app.render();
        break;
      case 'sheet-add-photos':
        state.sheet = { type: 'addphotos', collectionId: d.id };
        app.render();
        break;
      case 'close-sheet':
        state.sheet = null;
        app.render();
        break;

      case 'new-collection': {
        const name = prompt('Name this collection', 'Favourites');
        if (name) {
          app.createCollection(name).then(c => {
            if (d.photo) return app.toggleInCollection(c.id, d.photo);
            state.sheet = null;
            app.go('#/collection/' + c.id);
          });
        }
        break;
      }
      case 'toggle-collection': app.toggleInCollection(d.collection, d.photo); break;
      case 'set-cover': app.updateCollection(d.collection, { cover: d.photo }); break;
      case 'delete-collection':
        if (confirm('Delete this collection? Your photos are kept.')) app.deleteCollection(d.id);
        break;

      case 'install': app.install.prompt(); break;
      case 'dismiss-install': app.install.dismissBanner(); break;

      case 'export':
        Birdex.store.exportJSON().then(json => {
          const blob = new Blob([json], { type: 'application/json' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'birdex-backup-' + Birdex.fmtDayKey(Date.now()) + '.json';
          a.click();
          setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        });
        break;
      case 'wipe':
        if (confirm('Erase every sighting, photo and collection on this device?')) {
          Birdex.store.wipe().then(() => location.reload());
        }
        break;
    }
  }

  function onInput(e) {
    const el = e.target.closest('[data-on]');
    if (!el) return;
    const app = App();
    const state = app.state;

    switch (el.dataset.on) {
      case 'dex-search': state.dexQuery = el.value; app.render(); break;
      case 'log-search': state.pending.query = el.value; app.render(); break;
      case 'notes': state.pending.notes = el.value; break;
      case 'count': state.pending.count = el.value; break;
      case 'when': {
        const t = new Date(el.value).getTime();
        if (!isNaN(t)) state.pending.ts = t;
        break;
      }
      case 'collection-name': app.updateCollection(el.dataset.id, { name: el.value }); break;
    }
  }

  function onChange(e) {
    const el = e.target.closest('[data-on]');
    if (!el) return;
    const app = App();
    if (el.dataset.on === 'pick-photo' && el.files && el.files.length) {
      app.addPendingPhotos(el.files).then(() => { el.value = ''; });
    }
    if (el.dataset.on === 'region-pick') app.setManualRegion(el.value);
  }

  /* Settings view needs an async storage estimate; fetch it on demand. */
  views.refreshStorage = function () {
    Birdex.store.estimate().then(est => {
      App().state.storage = est || false;   // false = asked, browser declined
      App().render();
    });
  };

})(window);
</script>
<script>
/* =========================================================================
 * App state, routing and actions.
 *
 * Views are pure-ish render functions in views.js; everything that touches
 * state, storage or the device lives here.
 * ====================================================================== */
(function (global) {
  'use strict';

  const Birdex = global.Birdex = global.Birdex || {};
  const App = Birdex.app = {};

  const state = App.state = {
    ready: false,
    sightings: [],
    photos: [],
    collections: [],
    dexPhotos: {},          // speciesId -> photoId chosen as the dex portrait
    bySpecies: {},          // speciesId -> { count, first, last, photoIds }
    geo: null,              // { lat, lng, acc, ts }
    regionCode: null,
    regionExact: true,
    manualRegion: null,     // user override, wins over GPS
    geoStatus: 'idle',      // idle | locating | ok | denied | unavailable | outside
    geoError: null,
    month: new Date().getMonth() + 1,
    route: { name: 'dex', params: {} },
    dexQuery: '',
    dexFilter: 'all',
    nearbyFilter: 'all',
    pending: { photos: [], speciesId: null, notes: '', count: 1, ts: null, query: '' },
    sheet: null,
    storage: undefined,     // undefined = not asked yet, null = asking
    toast: null,
    demo: false
  };

  function freshPending() {
    return { photos: [], speciesId: null, notes: '', count: 1, ts: null, query: '' };
  }

  /* ------------------------------------------------------------------ */
  /* Derived data                                                        */
  /* ------------------------------------------------------------------ */

  function recompute() {
    const by = {};
    for (const s of state.sightings) {
      const e = by[s.speciesId] || (by[s.speciesId] = { count: 0, first: s.ts, last: s.ts, photoIds: [], regions: {} });
      e.count++;
      e.first = Math.min(e.first, s.ts);
      e.last = Math.max(e.last, s.ts);
      if (s.region) e.regions[s.region] = (e.regions[s.region] || 0) + 1;
    }
    for (const p of state.photos) {
      const e = by[p.speciesId];
      if (e) e.photoIds.push(p.id);
    }
    state.bySpecies = by;
  }

  App.seen = function (id) { return !!state.bySpecies[id]; };
  App.record = function (id) { return state.bySpecies[id] || null; };

  App.points = function () {
    let pts = 0;
    for (const id in state.bySpecies) {
      const sp = Birdex.get(id);
      if (sp) pts += sp.points;
    }
    return pts;
  };

  App.stats = function () {
    const speciesCount = Object.keys(state.bySpecies).length;
    const regions = {};
    const months = {};
    const families = {};
    for (const s of state.sightings) {
      if (s.region) regions[s.region] = true;
      months[new Date(s.ts).getMonth()] = true;
      const sp = Birdex.get(s.speciesId);
      if (sp) families[sp.fam] = (families[sp.fam] || 0) + 1;
    }
    return {
      species: speciesCount,
      sightings: state.sightings.length,
      photos: state.photos.length,
      points: App.points(),
      regions: Object.keys(regions).length,
      months: Object.keys(months).length,
      families,
      pctComplete: Math.round(speciesCount / Birdex.count() * 1000) / 10
    };
  };

  /** Photos of one species, newest first. */
  App.photosFor = function (speciesId) {
    return state.photos.filter(p => p.speciesId === speciesId).sort((a, b) => b.ts - a.ts);
  };

  App.photo = function (id) { return state.photos.find(p => p.id === id) || null; };

  /** The image that represents a species: your pick, else your latest shot. */
  App.dexPhoto = function (speciesId) {
    const chosen = state.dexPhotos[speciesId];
    if (chosen) {
      const p = App.photo(chosen);
      if (p) return p;
    }
    return App.photosFor(speciesId)[0] || null;
  };

  /* ------------------------------------------------------------------ */
  /* Badges                                                              */
  /* ------------------------------------------------------------------ */

  const BADGES = App.badges = [
    { id: 'first', name: 'First Light', desc: 'Log your first sighting.', test: s => s.sightings >= 1 },
    { id: 'ten', name: 'Ten Down', desc: 'Find 10 species.', test: s => s.species >= 10 },
    { id: 'fifty', name: 'Half Century', desc: 'Find 50 species.', test: s => s.species >= 50 },
    { id: 'century', name: 'Century', desc: 'Find 100 species.', test: s => s.species >= 100 },
    { id: 'shutter', name: 'Shutterbug', desc: 'Store 25 photos.', test: s => s.photos >= 25 },
    { id: 'roamer', name: 'Roamer', desc: 'Log sightings in 3 regions.', test: s => s.regions >= 3 },
    { id: 'allyear', name: 'All Year', desc: 'Log sightings in 6 different months.', test: s => s.months >= 6 },
    { id: 'night', name: 'Night Shift', desc: 'Find an owl.', test: (s, ctx) => ctx.family('Owls') || ctx.family('Barn Owls') },
    { id: 'talons', name: 'Talons', desc: 'Find 5 hawks, eagles or falcons.',
      test: (s, ctx) => ctx.familyCount('Hawks & Eagles') + ctx.familyCount('Falcons') + ctx.familyCount('Osprey') >= 5 },
    { id: 'waders', name: 'Waterline', desc: 'Find 8 waterbirds.',
      test: (s, ctx) => ['Ducks & Geese', 'Herons & Egrets', 'Sandpipers', 'Gulls & Terns', 'Rails & Coots',
        'Grebes', 'Loons', 'Pelicans', 'Cormorants', 'Cranes'].reduce((n, f) => n + ctx.familyCount(f), 0) >= 8 },
    { id: 'rare', name: 'Rare Find', desc: 'Find a species rated Rare or better.',
      test: (s, ctx) => ctx.anySpecies(sp => sp.globalTier.pts >= 180) },
    { id: 'curator', name: 'Curator', desc: 'Build a collection of 5 photos.',
      test: () => state.collections.some(c => c.photoIds.length >= 5) }
  ];

  App.earnedBadges = function () {
    const s = App.stats();
    const seenSpecies = Object.keys(state.bySpecies).map(id => Birdex.get(id)).filter(Boolean);
    const ctx = {
      family: fam => seenSpecies.some(sp => sp.fam === fam),
      familyCount: fam => seenSpecies.filter(sp => sp.fam === fam).length,
      anySpecies: fn => seenSpecies.some(fn)
    };
    return BADGES.map(b => ({ badge: b, earned: !!b.test(s, ctx) }));
  };

  /* ------------------------------------------------------------------ */
  /* Location                                                            */
  /* ------------------------------------------------------------------ */

  App.regionCode = function () {
    return state.manualRegion || state.regionCode;
  };

  App.regionLabel = function () {
    const code = App.regionCode();
    const r = code && Birdex.region(code);
    return r ? r.name : 'Location not set';
  };

  App.locate = function (opts) {
    opts = opts || {};
    if (!navigator.geolocation) {
      state.geoStatus = 'unavailable';
      state.geoError = 'This device has no location support.';
      return Promise.resolve(null);
    }
    state.geoStatus = 'locating';
    App.render();

    return new Promise(resolve => {
      navigator.geolocation.getCurrentPosition(pos => {
        App.setPosition(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
        resolve(state.geo);
      }, err => {
        state.geoStatus = err.code === 1 ? 'denied' : 'unavailable';
        state.geoError = err.code === 1
          ? 'Location permission was declined. You can pick a region by hand instead.'
          : 'Could not get a fix. You can pick a region by hand instead.';
        App.render();
        resolve(null);
      }, { enableHighAccuracy: !!opts.precise, timeout: 12000, maximumAge: opts.fresh ? 0 : 300000 });
    });
  };

  App.setPosition = function (lat, lng, acc) {
    state.geo = { lat, lng, acc: acc || null, ts: Date.now() };
    const hit = Birdex.regionAt(lat, lng);
    if (hit.region) {
      state.regionCode = hit.region.code;
      state.regionExact = hit.exact;
      state.geoStatus = 'ok';
      state.geoError = null;
    } else {
      state.regionCode = null;
      state.geoStatus = 'outside';
      state.geoError = 'You are outside the regions this dex has abundance data for' +
        (hit.nearest ? ' (nearest is ' + hit.nearest.name + ', about ' + hit.km + ' km away).' : '.');
    }
    Birdex.store.setSetting('lastGeo', state.geo);
    App.render();
    return state.geo;
  };

  App.setManualRegion = function (code) {
    state.manualRegion = code || null;
    Birdex.store.setSetting('manualRegion', state.manualRegion);
    App.render();
  };

  /* ------------------------------------------------------------------ */
  /* Actions                                                             */
  /* ------------------------------------------------------------------ */

  App.toast = function (msg, kind) {
    state.toast = { msg, kind: kind || 'info', id: Date.now() };
    App.render();
    clearTimeout(App._toastTimer);
    App._toastTimer = setTimeout(() => {
      state.toast = null;
      App.render();
    }, 3200);
  };

  /**
   * Commit the pending sighting: a sighting row, its photos, and a note of
   * whether this was a lifer (which is the whole reason a dex is fun).
   */
  App.saveSighting = function () {
    const p = state.pending;
    if (!p.speciesId) {
      App.toast('Pick which bird this was first.', 'warn');
      return Promise.resolve(null);
    }
    const sp = Birdex.get(p.speciesId);
    const lifer = !App.seen(p.speciesId);
    const ts = p.ts || Date.now();
    const code = App.regionCode();

    const sighting = {
      id: Birdex.store.id('sg'),
      speciesId: p.speciesId,
      ts,
      lat: state.geo ? state.geo.lat : null,
      lng: state.geo ? state.geo.lng : null,
      acc: state.geo ? state.geo.acc : null,
      region: code || null,
      manualRegion: !!state.manualRegion,
      notes: (p.notes || '').trim(),
      count: Math.max(1, parseInt(p.count, 10) || 1),
      photoIds: []
    };

    /* Photos were decoded and re-encoded when they were picked; all that is
     * left is to attach them to the sighting that now exists. */
    const saves = p.photos.map(pending => {
      const photo = {
        id: Birdex.store.id('ph'),
        sightingId: sighting.id,
        speciesId: sighting.speciesId,
        ts,
        full: pending.full, thumb: pending.thumb, w: pending.w, h: pending.h,
        bytes: pending.full.size + pending.thumb.size
      };
      sighting.photoIds.push(photo.id);
      return Birdex.store.putPhoto(photo).then(() => photo);
    });

    return Promise.all(saves)
      .then(saved => Birdex.store.putSighting(sighting).then(() => saved))
      .then(saved => {
        state.sightings.unshift(sighting);
        state.sightings.sort((a, b) => b.ts - a.ts);
        saved.forEach(ph => state.photos.unshift(ph));
        recompute();
        p.photos.forEach(ph => { if (ph.url) URL.revokeObjectURL(ph.url); });
        state.pending = freshPending();
        App.go('#/species/' + sighting.speciesId + (lifer ? '?new=1' : ''));
        App.toast(lifer
          ? 'New dex entry: ' + sp.n + '  +' + sp.points + ' pts'
          : 'Logged ' + sp.n + '.', lifer ? 'good' : 'info');
        return sighting;
      });
  };

  App.deleteSighting = function (id) {
    return Birdex.store.deleteSighting(id).then(() => {
      const s = state.sightings.find(x => x.id === id);
      state.sightings = state.sightings.filter(x => x.id !== id);
      state.photos = state.photos.filter(p => p.sightingId !== id);
      return Birdex.store.allCollections();
    }).then(cols => {
      state.collections = cols;
      return Birdex.store.getSetting('dexPhotos', {});
    }).then(map => {
      state.dexPhotos = map;
      recompute();
      App.toast('Sighting deleted.');
      App.render();
    });
  };

  App.setDexPhoto = function (speciesId, photoId) {
    state.dexPhotos[speciesId] = photoId;
    return Birdex.store.setSetting('dexPhotos', state.dexPhotos).then(() => {
      App.toast('Dex photo updated.', 'good');
      App.render();
    });
  };

  App.deletePhoto = function (photoId) {
    return Birdex.store.deletePhoto(photoId).then(() => {
      state.photos = state.photos.filter(p => p.id !== photoId);
      for (const s of state.sightings) {
        if (s.photoIds) s.photoIds = s.photoIds.filter(id => id !== photoId);
      }
      return Birdex.store.allCollections();
    }).then(cols => {
      state.collections = cols;
      return Birdex.store.getSetting('dexPhotos', {});
    }).then(map => {
      state.dexPhotos = map;
      recompute();
      App.toast('Photo deleted.');
      App.render();
    });
  };

  App.createCollection = function (name) {
    const c = {
      id: Birdex.store.id('cl'),
      name: (name || 'New collection').trim().slice(0, 60),
      note: '',
      createdAt: Date.now(),
      photoIds: [],
      cover: null
    };
    return Birdex.store.putCollection(c).then(() => {
      state.collections.push(c);
      App.render();
      return c;
    });
  };

  App.updateCollection = function (id, patch) {
    const c = state.collections.find(x => x.id === id);
    if (!c) return Promise.resolve(null);
    Object.assign(c, patch);
    if (!c.cover || c.photoIds.indexOf(c.cover) === -1) c.cover = c.photoIds[0] || null;
    return Birdex.store.putCollection(c).then(() => { App.render(); return c; });
  };

  App.toggleInCollection = function (collectionId, photoId) {
    const c = state.collections.find(x => x.id === collectionId);
    if (!c) return Promise.resolve(null);
    const i = c.photoIds.indexOf(photoId);
    if (i === -1) c.photoIds.push(photoId); else c.photoIds.splice(i, 1);
    return App.updateCollection(collectionId, {});
  };

  App.deleteCollection = function (id) {
    return Birdex.store.deleteCollection(id).then(() => {
      state.collections = state.collections.filter(c => c.id !== id);
      App.toast('Collection deleted.');
      App.go('#/collections');
    });
  };

  /* ------------------------------------------------------------------ */
  /* Pending sighting helpers                                            */
  /* ------------------------------------------------------------------ */

  App.addPendingPhotos = function (files) {
    const list = Array.from(files || []);
    if (!list.length) return Promise.resolve([]);
    App.toast('Processing ' + list.length + ' photo' + (list.length > 1 ? 's' : '') + '…');
    return list.reduce((chain, f) => chain.then(() =>
      Birdex.photos.process(f)
        .then(out => {
          /* One preview URL per pending photo, minted here rather than in
           * the view, which would leak a URL on every re-render. */
          out.url = URL.createObjectURL(out.thumb);
          state.pending.photos.push(out);
        })
        .catch(() => { App.toast('One file could not be read.', 'warn'); })
    ), Promise.resolve()).then(() => {
      App.render();
      return state.pending.photos;
    });
  };

  App.removePendingPhoto = function (index) {
    const gone = state.pending.photos.splice(index, 1)[0];
    if (gone && gone.url) URL.revokeObjectURL(gone.url);
    App.render();
  };

  /* ------------------------------------------------------------------ */
  /* Installing as an app                                                */
  /*                                                                     */
  /* Three worlds: Chromium fires beforeinstallprompt and gives us a     */
  /* real button; iOS never does, and needs the Share-sheet instructions */
  /* spelled out; everything else falls back to the browser menu.        */
  /* ------------------------------------------------------------------ */

  const install = App.install = {};

  install.isInstalled = function () {
    return !!(global.__bxInstall && global.__bxInstall.installed) ||
      (global.matchMedia && global.matchMedia('(display-mode: standalone)').matches) ||
      global.navigator.standalone === true;
  };

  install.canPrompt = function () {
    return !!(global.__bxInstall && global.__bxInstall.event);
  };

  /** 'ios' | 'android' | 'desktop' — only used to pick the right wording. */
  install.platform = function () {
    const ua = global.navigator.userAgent || '';
    if (/iPad|iPhone|iPod/.test(ua) ||
        (global.navigator.platform === 'MacIntel' && global.navigator.maxTouchPoints > 1)) return 'ios';
    if (/Android/.test(ua)) return 'android';
    return 'desktop';
  };

  install.prompt = function () {
    const ev = global.__bxInstall && global.__bxInstall.event;
    if (!ev) return Promise.resolve('unavailable');
    global.__bxInstall.event = null;      // a prompt event is single-use
    return ev.prompt()
      .then(() => ev.userChoice)
      .then(choice => {
        const outcome = choice && choice.outcome;
        if (outcome === 'accepted') App.toast('Installing Birdex…', 'good');
        else App.render();
        return outcome;
      })
      .catch(() => { App.render(); return 'error'; });
  };

  install.dismissBanner = function () {
    state.installDismissed = true;
    Birdex.store.setSetting('installDismissed', true);
    App.render();
  };

  /* ------------------------------------------------------------------ */
  /* Routing                                                             */
  /* ------------------------------------------------------------------ */

  function parseRoute() {
    const raw = (location.hash || '#/dex').replace(/^#/, '');
    const [path, qs] = raw.split('?');
    const parts = path.split('/').filter(Boolean);
    const params = {};
    if (qs) {
      qs.split('&').forEach(kv => {
        const [k, v] = kv.split('=');
        params[decodeURIComponent(k)] = decodeURIComponent(v || '');
      });
    }
    const name = parts[0] || 'dex';
    if (parts[1]) params.id = decodeURIComponent(parts[1]);
    return { name, params };
  }

  App.go = function (hash) {
    if (location.hash === hash) { App.render(); return; }
    location.hash = hash;
  };

  App.back = function () {
    if (history.length > 1) history.back();
    else App.go('#/dex');
  };

  App.render = function () {
    if (!state.ready) return;
    Birdex.views.render(state);
  };

  /* ------------------------------------------------------------------ */
  /* Boot                                                                */
  /* ------------------------------------------------------------------ */

  App.boot = function () {
    return Promise.all([
      Birdex.store.allSightings(),
      Birdex.store.allPhotos(),
      Birdex.store.allCollections(),
      Birdex.store.getSetting('dexPhotos', {}),
      Birdex.store.getSetting('manualRegion', null),
      Birdex.store.getSetting('lastGeo', null),
      Birdex.store.getSetting('installDismissed', false)
    ]).then(([sightings, photos, collections, dexPhotos, manualRegion, lastGeo, installDismissed]) => {
      state.installDismissed = installDismissed;
      state.sightings = sightings;
      state.photos = photos;
      state.collections = collections;
      state.dexPhotos = dexPhotos || {};
      state.manualRegion = manualRegion;
      if (lastGeo) {
        state.geo = lastGeo;
        const hit = Birdex.regionAt(lastGeo.lat, lastGeo.lng);
        if (hit.region) { state.regionCode = hit.region.code; state.regionExact = hit.exact; state.geoStatus = 'ok'; }
      }
      recompute();
      state.ready = true;
      state.route = parseRoute();
      Birdex.views.mount();
      App.render();

      window.addEventListener('hashchange', () => {
        state.route = parseRoute();
        window.scrollTo(0, 0);
        App.render();
      });

      /* The install prompt can arrive after first paint. */
      document.addEventListener('bx-install-state', () => App.render());

      /* A dex without a location is only half useful, so ask early — but
       * only when the browser says we already have permission, to avoid a
       * cold prompt on first paint. */
      if (navigator.permissions && navigator.permissions.query) {
        navigator.permissions.query({ name: 'geolocation' })
          .then(p => { if (p.state === 'granted') App.locate(); })
          .catch(() => {});
      }
    });
  };

  /* ------------------------------------------------------------------ */
  /* Demo hook — drives the app for the automated tester                 */
  /* ------------------------------------------------------------------ */

  let demoTimer = null;

  function demoStep() {
    const code = App.regionCode();
    const pool = code ? Birdex.speciesForRegion(code) .map(r => r.sp) : Birdex.all();
    const undiscovered = pool.filter(sp => !App.seen(sp.id));
    if (!undiscovered.length) return Promise.resolve();
    const sp = undiscovered[0];
    const seed = state.sightings.length + 1;

    return Birdex.photos.synthetic(seed).then(img => {
      img.url = URL.createObjectURL(img.thumb);
      state.pending.photos = [img];
      state.pending.speciesId = sp.id;
      state.pending.notes = 'Logged by the demo birder.';
      state.pending.count = 1;
      state.pending.ts = Date.now() - seed * 3600e3;
      return App.saveSighting();
    });
  }

  global.__birdex = {
    setDemo(on) { on ? this.startDemo() : this.stopDemo(); },
    startDemo() {
      if (demoTimer) return;
      state.demo = true;
      if (!App.regionCode()) App.setManualRegion('NE');
      const tick = () => { demoStep().then(() => { if (demoTimer) demoTimer = setTimeout(tick, 350); }); };
      demoTimer = setTimeout(tick, 60);
    },
    stopDemo() {
      state.demo = false;
      clearTimeout(demoTimer);
      demoTimer = null;
    },
    state() {
      const s = App.stats();
      return {
        progress: s.species,
        score: s.points,
        mode: state.route.name,
        species: s.species,
        sightings: s.sightings,
        photos: s.photos,
        region: App.regionCode(),
        total: Birdex.count()
      };
    },
    /* Handles for tests: seed a position or a sighting without a camera. */
    setPosition: (lat, lng, acc) => App.setPosition(lat, lng, acc || 25),
    setRegion: code => App.setManualRegion(code),
    logSpecies(id, withPhoto) {
      state.pending.speciesId = id;
      state.pending.notes = 'test';
      const go = withPhoto === false
        ? Promise.resolve()
        : Birdex.photos.synthetic(state.sightings.length + 1).then(img => {
            img.url = URL.createObjectURL(img.thumb);
            state.pending.photos = [img];
          });
      return go.then(() => App.saveSighting());
    },
    app: App,
    core: Birdex
  };

})(window);
</script>
<script>
  Birdex.app.boot().catch(function (err) {
    console.error(err);
    // The usual causes are a private window and, for a file opened straight
    // from disk, a browser that refuses storage to file:// pages (Safari).
    var local = location.protocol === 'file:';
    document.getElementById('app').innerHTML =
      '<div style="padding:24px;max-width:560px;margin:0 auto;line-height:1.5">' +
      '<h1>Birdex could not start</h1>' +
      '<p style="color:#888">It could not open browser storage, so there is nowhere to keep your photos.</p>' +
      (local
        ? '<p style="color:#888">This copy was opened directly from a file. Chrome, Edge and Firefox allow that; ' +
          'Safari does not. Either open this file in one of those, or serve the folder — ' +
          '<code>python3 -m http.server 8000</code> — and visit <code>localhost:8000</code>.</p>'
        : '<p style="color:#888">Private windows often block IndexedDB. Try an ordinary window.</p>') +
      '<pre style="white-space:pre-wrap;font-size:12px;color:#888">' + String(err && err.message || err) + '</pre></div>';
  });

  // No service worker in the offline copy: this file is the offline copy.
</script>
</body>
</html>
