    p.wing = Object.assign({}, BASE.wing, s.wing || {});
    p.crest = s.crest || null;
    p.neck = s.neck || null;
    return p;
  }

  /* -------------------------------------------------------------- */
  /* Small geometry helpers                                          */
  /* -------------------------------------------------------------- */

  const rad = d => d * Math.PI / 180;
  const pt = (x, y) => x.toFixed(1) + ',' + y.toFixed(1);

  function poly(points, fill, extra) {
    return '<polygon points="' + points.map(p => pt(p[0], p[1])).join(' ') +
      '" fill="' + fill + '"' + (extra || '') + '/>';
  }

  function ellipse(cx, cy, rx, ry, rot, fill, extra) {
    return '<ellipse cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) +
      '" rx="' + rx.toFixed(1) + '" ry="' + ry.toFixed(1) + '"' +
      (rot ? ' transform="rotate(' + rot.toFixed(1) + ' ' + cx.toFixed(1) + ' ' + cy.toFixed(1) + ')"' : '') +
      ' fill="' + fill + '"' + (extra || '') + '/>';
  }

  /** Mix a hex colour towards white (t > 0) or black (t < 0). */
  function shade(hex, t) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    const to = t > 0 ? 255 : 0, k = Math.abs(t);
    r = Math.round(r + (to - r) * k);
    g = Math.round(g + (to - g) * k);
    b = Math.round(b + (to - b) * k);
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  }
  art.shade = shade;

  /** Rough perceived luminance, for deciding what an eye should sit on. */
  function lum(hex) {
    const n = parseInt(hex.slice(1), 16);
    return (0.299 * ((n >> 16) & 255) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
  }
  art.lum = lum;

  /* -------------------------------------------------------------- */
  /* Parts                                                           */
  /* -------------------------------------------------------------- */

  function billShape(hx, hy, hr, bill, color) {
    const x0 = hx + hr * 0.7;
    const d = bill.dep, L = bill.len, cv = bill.curve || 0;
    const t = bill.type;

    if (t === 'spoon') {                       // duck / goose: blunt and broad
      return '<path d="M' + pt(x0, hy - d / 2) + ' L' + pt(x0 + L - d / 2, hy - d / 2) +
        ' A' + (d / 2) + ',' + (d / 2) + ' 0 0 1 ' + pt(x0 + L - d / 2, hy + d / 2) +
        ' L' + pt(x0, hy + d / 2) + ' Z" fill="' + color + '"/>';
    }
    if (t === 'pouch') {                       // pelican: bill plus throat pouch
      return '<path d="M' + pt(x0, hy - d / 3) + ' L' + pt(x0 + L, hy + 2) +
        ' L' + pt(x0 + L * 0.55, hy + d) + ' Q' + pt(x0 + L * 0.2, hy + d * 0.9) + ' ' + pt(x0, hy + d / 3) +
        ' Z" fill="' + color + '"/>';
    }
    if (t === 'spatula') {                     // spoonbill
      return '<path d="M' + pt(x0, hy - d / 2) + ' L' + pt(x0 + L * 0.7, hy - d * 0.35) +
        ' L' + pt(x0 + L * 0.7, hy + d * 0.35) + ' L' + pt(x0, hy + d / 2) + ' Z" fill="' + color + '"/>' +
        ellipse(x0 + L * 0.85, hy, L * 0.2, d * 1.1, 0, color);
    }
    if (t === 'wedge') {                       // puffin: deep triangular plate
      return poly([[x0, hy - d / 2], [x0 + L, hy - d * 0.15], [x0 + L, hy + d * 0.25], [x0, hy + d / 2]], color);
    }
    if (t === 'hook') {
      return poly([[x0, hy - d / 2], [x0 + L, hy - d * 0.1], [x0 + L * 0.55, hy + d * 0.45], [x0, hy + d / 2]], color) +
        poly([[x0 + L * 0.75, hy - d * 0.3], [x0 + L + 1.5, hy + d * 0.2], [x0 + L * 0.6, hy + d * 0.3]], color);
    }
    if (t === 'gull') {                        // straight with a gonydeal bulge
      return poly([[x0, hy - d / 2], [x0 + L, hy - d * 0.15], [x0 + L, hy + d * 0.25],
        [x0 + L * 0.6, hy + d * 0.55], [x0, hy + d / 2]], color);
    }
    if (t === 'chisel') {
      return poly([[x0, hy - d / 2], [x0 + L, hy - d * 0.18], [x0 + L, hy + d * 0.18], [x0, hy + d / 2]], color);
    }
    if (t === 'broad') {
      return poly([[x0 - 1, hy - d / 2], [x0 + L, hy], [x0 - 1, hy + d / 2]], color);
    }
    if (cv) {                                  // decurved: bend the tip downwards
      return '<path d="M' + pt(x0, hy - d / 2) + ' Q' + pt(x0 + L * 0.6, hy - d * 0.1 + cv * 0.6) + ' ' +
        pt(x0 + L, hy + cv) + ' Q' + pt(x0 + L * 0.55, hy + d * 0.5 + cv * 0.4) + ' ' +
        pt(x0, hy + d / 2) + ' Z" fill="' + color + '"/>';
    }
    /* cone / dagger / needle all share one triangle, just proportioned differently */
    return poly([[x0, hy - d / 2], [x0 + L, hy], [x0, hy + d / 2]], color);
  }

  function crestShape(hx, hy, hr, crest, color) {
    const s = crest.size;
    if (crest.type === 'point') {
      return poly([[hx - hr * 0.5, hy - hr * 0.75], [hx - hr * 0.2, hy - hr - s], [hx + hr * 0.45, hy - hr * 0.7]], color);
    }
    if (crest.type === 'shag') {
      return poly([[hx - hr * 0.9, hy - hr * 0.4], [hx - hr - s, hy - hr * 0.9], [hx - hr * 0.3, hy - hr * 0.95]], color);
    }
    if (crest.type === 'plume') {              // quail: forward-curling teardrop
      return '<path d="M' + pt(hx + hr * 0.1, hy - hr * 0.9) + ' Q' + pt(hx + hr * 0.1, hy - hr - s) + ' ' +
        pt(hx + hr * 0.9, hy - hr - s * 0.75) + ' Q' + pt(hx + hr * 0.35, hy - hr - s * 0.35) + ' ' +
        pt(hx + hr * 0.55, hy - hr * 0.75) + ' Z" fill="' + color + '"/>';
    }
    if (crest.type === 'fan') {
      let d = 'M' + pt(hx - hr * 0.6, hy - hr * 0.6);
      for (let i = 0; i <= 5; i++) {
        const a = rad(-160 + i * 26);
        d += ' L' + pt(hx + (hr + s) * Math.cos(a) * 0.9, hy + (hr + s) * Math.sin(a));
      }
      d += ' L' + pt(hx + hr * 0.6, hy - hr * 0.6) + ' Z';
      return '<path d="' + d + '" fill="' + color + '"/>';
    }
    return '';
  }

  function tailShape(p, color) {
    const a = rad(p.tail.ang);
    const bx = p.bx + Math.cos(a) * p.brx * 0.75;
    const by = p.by + Math.sin(a) * p.bry * 0.75;
    const tx = p.bx + Math.cos(a) * (p.brx * 0.55 + p.tail.len);
    const ty = p.by + Math.sin(a) * (p.brx * 0.55 + p.tail.len);
    const nx = -Math.sin(a), ny = Math.cos(a);
    const w = p.tail.w / 2, f = p.tail.fork || 0;

    if (f > 0) {
      return poly([
        [bx + nx * w * 0.6, by + ny * w * 0.6],
        [tx + nx * w, ty + ny * w],
        [tx - Math.cos(a) * f, ty - Math.sin(a) * f],
        [tx - nx * w, ty - ny * w],
        [bx - nx * w * 0.6, by - ny * w * 0.6]
      ], color);
    }
    return poly([
      [bx + nx * w * 0.7, by + ny * w * 0.7],
      [tx + nx * w, ty + ny * w],
      [tx - nx * w, ty - ny * w],
      [bx - nx * w * 0.7, by - ny * w * 0.7]
    ], color);
  }

  function legShapes(p, color) {
    if (p.legs.type === 'none' || !p.legs.len) return '';
    /* Start inside the body so the legs emerge from it rather than hanging
     * off the bottom edge. */
    const y0 = p.by + p.bry * 0.45;
    const w = p.legs.w, L = p.legs.len;
    const line = (x1, y1, x2, y2, sw) =>
      '<line x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x2.toFixed(1) +
      '" y2="' + y2.toFixed(1) + '" stroke="' + color + '" stroke-width="' + sw +
      '" stroke-linecap="round"/>';

    if (p.legs.type === 'cling') {             // woodpecker: braced against a trunk
      return line(p.bx + 2, y0, p.bx - 7, y0 + L * 0.7, w) +
        line(p.bx - 7, y0 + L * 0.7, p.bx - 12, y0 + L * 0.55, w * 0.7);
    }

    const toe = Math.max(3, L * 0.28);
    let out = '';
    /* Two legs, slightly offset in depth: the far one thinner and paler-set. */
    [[-3.5, w * 0.85], [4.5, w]].forEach(([dx, sw]) => {
      const x = p.bx + dx + (p.legs.type === 'wade' ? 3 : 1);
      const foot = y0 + L;
      out += line(x, y0, x, foot, sw);
      /* Foot spans both ways, so it reads as a foot and not as a letter L. */
      out += line(x - toe * 0.55, foot, x + toe, foot, Math.max(1.5, sw * 0.65));
    });
    return out;
  }

  function neckShape(p, hx, hy, color) {
    const n = p.neck;
    if (!n) return '';
    const w = n.w / 2;
    const sx = p.bx + p.brx * 0.35, sy = p.by - p.bry * 0.35;
    if (n.kink) {                              // heron: folded S-neck
      return '<path d="M' + pt(sx, sy) + ' Q' + pt(sx - 4, (sy + hy) / 2) + ' ' + pt(hx - 2, hy + 2) +
        ' L' + pt(hx + w, hy + 4) + ' Q' + pt(sx + 8, (sy + hy) / 2) + ' ' + pt(sx + w * 2, sy + 3) +
        ' Z" fill="' + color + '"/>';
    }
    if (n.curve) {                             // swan: S-curve
      return '<path d="M' + pt(sx, sy) + ' Q' + pt(sx + n.curve + 6, (sy + hy) / 2) + ' ' + pt(hx - w, hy + 4) +
        ' L' + pt(hx + w, hy + 6) + ' Q' + pt(sx + n.curve - 4, (sy + hy) / 2 + 6) + ' ' + pt(sx + w * 2.2, sy + 4) +
        ' Z" fill="' + color + '"/>';
    }
    return poly([[sx - w, sy + 2], [hx - w * 0.9, hy + 2], [hx + w * 0.9, hy + 4], [sx + w * 1.6, sy + 5]], color);
  }

  function flyingWings(p, back, under) {
    const w = p.wingspan, y = p.by + w.up;
    let out = '';
    /* Far wing first so the near one overlaps it. */
    out += poly([[p.bx - 4, p.by - 4], [p.bx - w.len * 0.75, y - w.sweep * 0.5],
      [p.bx - w.len * 0.62, y - w.sweep * 0.5 + w.w], [p.bx - 2, p.by + 3]], shade(back, -0.18));
    out += poly([[p.bx + 2, p.by - 5], [p.bx + w.len * 0.55, y - w.sweep], [p.bx + w.len * 0.42, y - w.sweep + w.w],
      [p.bx + 4, p.by + 2]], back);
    return out;
  }

  /* -------------------------------------------------------------- */
  /* The portrait                                                    */
  /* -------------------------------------------------------------- */

  /**
   * Build the SVG innards for a species.
   * `mode`: 'colour' for a full portrait, 'locked' for an undiscovered
   * silhouette (one flat tone, no detail — the classic dex tease).
   */
  function body(sp, mode) {
    const p = plan(sp.shape);
    const locked = mode === 'locked';
    const c = sp.c || ['#7a828f', '#d8d5cc', '#8b929c', '#3a3f47'];

    const back = locked ? 'var(--dex-locked)' : c[0];
    const under = locked ? 'var(--dex-locked)' : c[1];
    const head = locked ? 'var(--dex-locked)' : c[2];
    const billC = locked ? 'var(--dex-locked)' : c[3];
    const legC = locked ? 'var(--dex-locked)' : shade(c[3], -0.15);
    /* An optional fifth colour paints the wing, for birds whose wing patch
     * is the field mark — a Red-winged Blackbird, an American Redstart. */
    const wingC = locked ? 'var(--dex-locked)' : (c[4] || shade(c[0], -0.22));

    const hx = p.bx + p.nx, hy = p.by + p.ny;
    let out = '';

    if (!p.fly) out += legShapes(p, legC);
    out += tailShape(p, back);
    if (p.fly) out += flyingWings(p, back, under);

    out += ellipse(p.bx, p.by, p.brx, p.bry, p.brot, back);
    /* Underparts: a smaller ellipse pushed forward and down. */
    out += ellipse(p.bx + p.brx * 0.22, p.by + p.bry * 0.34, p.brx * 0.66, p.bry * 0.58, p.brot, under);
    if (!p.fly) out += ellipse(p.bx + p.wing.dx, p.by + p.wing.dy, p.wing.rx, p.wing.ry, p.wing.rot, wingC);

    out += neckShape(p, hx, hy, head);
    if (p.crest) out += crestShape(hx, hy, p.hr, p.crest, head);
    out += ellipse(hx, hy, p.hr, p.hr * 0.94, 0, head);
    out += billShape(hx, hy, p.hr, p.bill, billC);

    /* Eye: dark on a pale head, pale on a dark one, so it always reads. */
    if (!locked) {
      const ex = hx + p.hr * 0.34, ey = hy - p.hr * 0.18;
      const dark = lum(head) < 0.45;
      if (p.owlEyes) {
        out += ellipse(ex, ey, p.eye + 1.6, p.eye + 1.6, 0, dark ? '#f2c94c' : '#e8b62a');
        out += ellipse(ex, ey, p.eye * 0.62, p.eye * 0.62, 0, '#1a1d21');
      } else {
        out += ellipse(ex, ey, p.eye + 0.9, p.eye + 0.9, 0, dark ? shade(head, 0.55) : shade(head, -0.55));
        out += ellipse(ex, ey, p.eye * 0.55, p.eye * 0.55, 0, dark ? '#1a1d21' : '#12151a');
      }
    }

    if (p.water) {
      out += '<rect x="6" y="' + (p.by + p.bry * 0.55).toFixed(1) +
        '" width="108" height="30" rx="6" fill="var(--dex-water)"/>';
    }
    return out;
  }

  /**
   * Full <svg> for a species portrait.
   * opts: { locked, size, className, decorative }
   */
  art.portrait = function (sp, opts) {
    opts = opts || {};
    const mode = opts.locked ? 'locked' : 'colour';
    const label = opts.locked ? 'Undiscovered species silhouette' : sp.n;
    return '<svg class="art ' + (opts.className || '') + '" viewBox="0 0 120 100" ' +
      'preserveAspectRatio="xMidYMid meet" role="img" aria-label="' + Birdex.escape(label) + '">' +
      body(sp, mode) +
      (opts.locked ? '<text class="art-q" x="60" y="30" text-anchor="middle">?</text>' : '') +
      '</svg>';
  };

  /** Shapes actually used by the dataset — handy when checking coverage. */
  art.shapes = Object.keys(SHAPES);

})(window);
</script>
<script>
/* =========================================================================
 * Storage.
 *
 * Everything lives in IndexedDB on the device: photos are Blobs, so there
 * is no server, no upload and no account. Object URLs are cached and
 * revoked centrally, because a photo grid that mints a fresh URL per
 * render leaks memory quickly on a phone.
 * ====================================================================== */
(function (global) {
  'use strict';

  const Birdex = global.Birdex = global.Birdex || {};
  const DB_NAME = 'birdex';
  const DB_VERSION = 1;

  let dbp = null;

  function open() {
    if (dbp) return dbp;
    dbp = new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains('sightings')) {
          const s = db.createObjectStore('sightings', { keyPath: 'id' });
          s.createIndex('ts', 'ts');
          s.createIndex('speciesId', 'speciesId');
        }
        if (!db.objectStoreNames.contains('photos')) {
          const p = db.createObjectStore('photos', { keyPath: 'id' });
          p.createIndex('ts', 'ts');
          p.createIndex('sightingId', 'sightingId');
          p.createIndex('speciesId', 'speciesId');
        }
        if (!db.objectStoreNames.contains('collections')) {
          db.createObjectStore('collections', { keyPath: 'id' });
        }
        if (!db.objectStoreNames.contains('settings')) {
          db.createObjectStore('settings', { keyPath: 'key' });
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return dbp;
  }

  function tx(names, mode, fn) {
    return open().then(db => new Promise((resolve, reject) => {
      const t = db.transaction(names, mode);
      let result;
      t.oncomplete = () => resolve(result);
      t.onerror = () => reject(t.error);
      t.onabort = () => reject(t.error);
      result = fn(names.map ? names.map(n => t.objectStore(n)) : t.objectStore(names), t);
    }));
  }

  function reqp(req) {
    return new Promise((resolve, reject) => {
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  const store = Birdex.store = {};

  store.id = function (prefix) {
    /* Time-ordered so a plain sort by id is also a sort by creation. */
    return (prefix || 'x') + '_' + Date.now().toString(36) + '_' +
      Math.random().toString(36).slice(2, 8);
  };

  /* ---------------------------- sightings --------------------------- */

  store.putSighting = function (s) {
    return tx('sightings', 'readwrite', st => { st.put(s); }).then(() => s);
  };

  store.allSightings = function () {
    return open().then(db => new Promise((resolve, reject) => {
      const out = [];
      const req = db.transaction('sightings').objectStore('sightings').index('ts').openCursor(null, 'prev');
      req.onsuccess = () => {
        const cur = req.result;
        if (!cur) return resolve(out);
        out.push(cur.value);
        cur.continue();
      };
      req.onerror = () => reject(req.error);
    }));
  };

  store.getSighting = function (id) {
    return open().then(db => reqp(db.transaction('sightings').objectStore('sightings').get(id)));
  };

  /** Deleting a sighting takes its photos with it, and cleans collections. */
  store.deleteSighting = function (id) {
    return store.photosForSighting(id).then(photos => {
      const photoIds = photos.map(p => p.id);
      return store.removePhotosFromCollections(photoIds)
        .then(() => tx(['sightings', 'photos'], 'readwrite', ([sg, ph]) => {
          sg.delete(id);
          photoIds.forEach(pid => { ph.delete(pid); Birdex.store.revoke(pid); });
        }))
        .then(() => store.getSetting('dexPhotos', {}))
        .then(map => {
          let changed = false;
          for (const k in map) if (photoIds.indexOf(map[k]) !== -1) { delete map[k]; changed = true; }
          return changed ? store.setSetting('dexPhotos', map) : null;
        });
    });
  };

  /* ------------------------------ photos ---------------------------- */

  store.putPhoto = function (p) {
    return tx('photos', 'readwrite', st => { st.put(p); }).then(() => p);
  };

  store.getPhoto = function (id) {
    return open().then(db => reqp(db.transaction('photos').objectStore('photos').get(id)));
  };

  store.photosForSighting = function (sightingId) {
    return byIndex('photos', 'sightingId', sightingId);
  };

  store.photosForSpecies = function (speciesId) {
    return byIndex('photos', 'speciesId', speciesId).then(list => list.sort((a, b) => b.ts - a.ts));
  };

  store.allPhotos = function () {
    return open().then(db => new Promise((resolve, reject) => {
      const out = [];
      const req = db.transaction('photos').objectStore('photos').index('ts').openCursor(null, 'prev');
      req.onsuccess = () => {
        const cur = req.result;
        if (!cur) return resolve(out);
        out.push(cur.value);
        cur.continue();
      };
      req.onerror = () => reject(req.error);
    }));
  };

  store.deletePhoto = function (id) {
    return store.removePhotosFromCollections([id])
      .then(() => tx('photos', 'readwrite', st => { st.delete(id); }))
      .then(() => store.getSetting('dexPhotos', {}))
      .then(map => {
        let changed = false;
        for (const k in map) if (map[k] === id) { delete map[k]; changed = true; }
        return changed ? store.setSetting('dexPhotos', map) : null;
      })
      .then(() => store.revoke(id));
  };

  function byIndex(storeName, indexName, key) {
    return open().then(db => reqp(db.transaction(storeName).objectStore(storeName).index(indexName).getAll(key)));
  }

  /* --------------------------- collections -------------------------- */

  store.allCollections = function () {
    return open().then(db => reqp(db.transaction('collections').objectStore('collections').getAll()))
      .then(list => list.sort((a, b) => a.createdAt - b.createdAt));
  };

  store.putCollection = function (c) {
    return tx('collections', 'readwrite', st => { st.put(c); }).then(() => c);
  };

  store.getCollection = function (id) {
    return open().then(db => reqp(db.transaction('collections').objectStore('collections').get(id)));
  };

  store.deleteCollection = function (id) {
    return tx('collections', 'readwrite', st => { st.delete(id); });
  };

  /** Keep collections honest when the photos underneath them disappear. */
  store.removePhotosFromCollections = function (photoIds) {
    if (!photoIds.length) return Promise.resolve();
    return store.allCollections().then(cols => {
      const dirty = [];
      for (const c of cols) {
        const before = c.photoIds.length;
        c.photoIds = c.photoIds.filter(id => photoIds.indexOf(id) === -1);
        if (c.photoIds.length !== before) {
          if (photoIds.indexOf(c.cover) !== -1) c.cover = c.photoIds[0] || null;
          dirty.push(c);
        }
      }
      if (!dirty.length) return;
      return tx('collections', 'readwrite', st => { dirty.forEach(c => st.put(c)); });
    });
  };

  /* ----------------------------- settings --------------------------- */

  store.getSetting = function (key, fallback) {
    return open().then(db => reqp(db.transaction('settings').objectStore('settings').get(key)))
      .then(row => (row && row.value !== undefined) ? row.value : fallback);
  };

  store.setSetting = function (key, value) {
    return tx('settings', 'readwrite', st => { st.put({ key, value }); }).then(() => value);
  };

  /* --------------------------- object URLs -------------------------- */

  const urls = new Map();

  /** Stable object URL per photo id, so repeated renders reuse one URL. */
  store.url = function (photo, which) {
    const key = photo.id + ':' + (which || 'thumb');
    if (urls.has(key)) return urls.get(key);
    const blob = which === 'full' ? (photo.full || photo.thumb) : (photo.thumb || photo.full);
    const u = URL.createObjectURL(blob);
    urls.set(key, u);
    return u;
  };

  store.revoke = function (photoId) {
    for (const key of Array.from(urls.keys())) {
      if (key.indexOf(photoId + ':') === 0) {
        URL.revokeObjectURL(urls.get(key));
        urls.delete(key);
      }
    }
  };

  /* ------------------------------ admin ----------------------------- */

  store.estimate = function () {
    if (!navigator.storage || !navigator.storage.estimate) return Promise.resolve(null);
    return navigator.storage.estimate().catch(() => null);
  };

  store.wipe = function () {
    return tx(['sightings', 'photos', 'collections', 'settings'], 'readwrite', ([a, b, c, d]) => {
      a.clear(); b.clear(); c.clear(); d.clear();
    }).then(() => {
      urls.forEach(u => URL.revokeObjectURL(u));
      urls.clear();
    });
  };

  /** Metadata-only backup. Photos are deliberately left out — see the UI copy. */
  store.exportJSON = function () {
    return Promise.all([store.allSightings(), store.allCollections(), store.getSetting('dexPhotos', {})])
      .then(([sightings, collections, dexPhotos]) => JSON.stringify({
        app: 'birdex', version: 1, exportedAt: new Date().toISOString(),
        sightings, collections, dexPhotos
      }, null, 2));
  };

})(window);
</script>
<script>
/* =========================================================================
 * Photo intake.
 *
 * Phone cameras produce 3-12 MB files. Storing those untouched fills a
 * device quota after a couple of hundred birds, so every import is
 * re-encoded to a display-sized JPEG plus a small square thumbnail for
 * the grids. The original file is never kept.
 * ====================================================================== */
(function (global) {
  'use strict';

  const Birdex = global.Birdex = global.Birdex || {};
  const photos = Birdex.photos = {};

  const FULL_MAX = 1600;   // longest edge of the stored photo
  const THUMB = 400;       // square thumbnail edge
  const FULL_Q = 0.82;
  const THUMB_Q = 0.75;

  /** Decode a File/Blob to something drawable, preferring the fast path. */
  function decode(file) {
    if (global.createImageBitmap) {
      /* imageOrientation only matters for JPEGs with an EXIF rotation. */
      return createImageBitmap(file, { imageOrientation: 'from-image' })
        .catch(() => decodeViaImg(file));
    }
    return decodeViaImg(file);
  }

  function decodeViaImg(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not read that image.')); };
      img.src = url;
    });
  }

  function toBlob(canvas, quality) {
    return new Promise((resolve, reject) => {
      if (canvas.toBlob) {
        canvas.toBlob(b => b ? resolve(b) : reject(new Error('Encoding failed.')), 'image/jpeg', quality);
      } else {
        reject(new Error('Canvas encoding is unavailable.'));
      }
    });
  }

  function draw(src, w, h, sx, sy, sw, sh) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#10141a';
    ctx.fillRect(0, 0, w, h);
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(src, sx, sy, sw, sh, 0, 0, w, h);
    return c;
  }

  /**
   * File -> { full, thumb, w, h } ready to hand to the store.
   * The thumbnail is a centre crop so grids stay tidy; the full copy keeps
   * the original aspect ratio.
   */
  photos.process = function (file) {
    return decode(file).then(src => {
      const iw = src.width || src.naturalWidth;
      const ih = src.height || src.naturalHeight;
      if (!iw || !ih) throw new Error('That file did not look like an image.');

      const scale = Math.min(1, FULL_MAX / Math.max(iw, ih));
      const fw = Math.max(1, Math.round(iw * scale));
      const fh = Math.max(1, Math.round(ih * scale));
      const fullCanvas = draw(src, fw, fh, 0, 0, iw, ih);

      const side = Math.min(iw, ih);
      const thumbCanvas = draw(src, THUMB, THUMB, (iw - side) / 2, (ih - side) / 2, side, side);

      return Promise.all([toBlob(fullCanvas, FULL_Q), toBlob(thumbCanvas, THUMB_Q)])
        .then(([full, thumb]) => {
          if (src.close) src.close();
          return { full, thumb, w: fw, h: fh };
        });
    });
  };

  /** Import a list of files into one sighting, skipping anything unreadable. */
  photos.importFiles = function (files, meta, onProgress) {
    const list = Array.from(files).filter(f => !f.type || f.type.indexOf('image/') === 0);
    const made = [];
    let done = 0;

    return list.reduce((chain, file) => chain.then(() =>
      photos.process(file).then(out => {
        const photo = {
          id: Birdex.store.id('ph'),
          sightingId: meta.sightingId,
          speciesId: meta.speciesId,
          ts: meta.ts || Date.now(),
          full: out.full, thumb: out.thumb, w: out.w, h: out.h,
          bytes: out.full.size + out.thumb.size
        };
        return Birdex.store.putPhoto(photo).then(() => { made.push(photo); });
      }).catch(err => {
        console.warn('Skipped a photo:', err);
      }).then(() => {
        done++;
        if (onProgress) onProgress(done, list.length);
      })
    ), Promise.resolve()).then(() => made);
  };

  /** A generated stand-in, used by the demo so tests need no camera. */
  photos.synthetic = function (seed) {
    const c = document.createElement('canvas');
    c.width = c.height = 480;
    const ctx = c.getContext('2d');
    const hue = (seed * 47) % 360;
    const g = ctx.createLinearGradient(0, 0, 480, 480);
    g.addColorStop(0, 'hsl(' + hue + ',45%,32%)');
    g.addColorStop(1, 'hsl(' + ((hue + 40) % 360) + ',35%,14%)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 480, 480);
    ctx.fillStyle = 'rgba(255,255,255,0.16)';
    for (let i = 0; i < 40; i++) {
      const x = (seed * 13 + i * 97) % 480, y = (seed * 29 + i * 53) % 480;
      ctx.beginPath();
      ctx.arc(x, y, 6 + (i % 5) * 4, 0, Math.PI * 2);
      ctx.fill();
    }
    return toBlob(c, 0.7).then(blob => ({ full: blob, thumb: blob, w: 480, h: 480 }));
  };

})(window);
</script>
<script>
/* =========================================================================
 * Views.
 *
 * One render pass rewrites the screen from state; all interaction is
 * delegated from the root, so nothing needs re-binding. Focus and caret
 * position are preserved across renders so typing in a search box works.
 * ====================================================================== */
(function (global) {
  'use strict';

  const Birdex = global.Birdex = global.Birdex || {};
  const views = Birdex.views = {};
  const esc = s => Birdex.escape(s);
  const App = () => Birdex.app;

  let root, viewEl, headEl, tabsEl, toastEl, sheetEl;

  const TABS = [
    { name: 'dex', href: '#/dex', label: 'Dex', icon: 'grid' },
    { name: 'nearby', href: '#/nearby', label: 'Nearby', icon: 'pin' },
    { name: 'log', href: '#/log', label: 'Log', icon: 'plus', primary: true },
    { name: 'collections', href: '#/collections', label: 'Album', icon: 'album' },
    { name: 'history', href: '#/history', label: 'History', icon: 'clock' }
  ];

  const ICONS = {
    grid: '<path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/>',
    pin: '<path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/>',
    plus: '<path d="M11 4h2v7h7v2h-7v7h-2v-7H4v-2h7z"/>',
    album: '<path d="M4 5h16v14H4zm2 10l3.5-4.5 2.5 3 3-4L18 17H6z"/>',
    clock: '<path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm1 9.6V7h-2v6.4l4.2 2.5 1-1.7z"/>',
    back: '<path d="M15.5 4L7 12l8.5 8 1.4-1.4L9.8 12l7.1-6.6z"/>',
    camera: '<path d="M9 4h6l1.5 2H20v14H4V6h3.5zM12 9a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9z"/>',
    star: '<path d="M12 3l2.6 5.6L20 9.4l-4 4 1 6-5-2.9L7 19.4l1-6-4-4 5.4-.8z"/>',
    trash: '<path d="M6 7h12l-1 13H7zM9 4h6l1 2H8z"/>'
  };

  /* evenodd matters: several icons cut their detail out of an outer shape,
   * and the default nonzero rule would fill them in as solid blocks. */
  function icon(name, cls) {
    return '<svg class="i ' + (cls || '') + '" viewBox="0 0 24 24" fill-rule="evenodd" aria-hidden="true">' +
      (ICONS[name] || '') + '</svg>';
  }

  /* ------------------------------------------------------------------ */
  /* Mount                                                               */
  /* ------------------------------------------------------------------ */

  views.mount = function () {
    root = document.getElementById('app');
    root.innerHTML =
      '<header id="head" class="head"></header>' +
      '<main id="view" class="view" tabindex="-1"></main>' +
      '<nav id="tabs" class="tabs" aria-label="Sections"></nav>' +
      '<div id="sheet" class="sheet-wrap" hidden></div>' +
      '<div id="toast" class="toast" role="status" aria-live="polite"></div>';

    headEl = document.getElementById('head');
    viewEl = document.getElementById('view');
    tabsEl = document.getElementById('tabs');
    toastEl = document.getElementById('toast');
    sheetEl = document.getElementById('sheet');

    root.addEventListener('click', onClick);
    root.addEventListener('input', onInput);
    root.addEventListener('change', onChange);
    root.addEventListener('submit', e => e.preventDefault());
  };

  /* ------------------------------------------------------------------ */
  /* Render                                                              */
  /* ------------------------------------------------------------------ */

  views.render = function (state) {
    const focus = captureFocus();

    /* The storage figure is async; ask once, the answer re-renders. */
    if (state.route.name === 'settings' && state.storage === undefined) {
      state.storage = null;
      views.refreshStorage();
    }

    headEl.innerHTML = renderHead(state);
    viewEl.innerHTML = renderView(state);
    tabsEl.innerHTML = renderTabs(state);

    if (state.sheet) {
      sheetEl.hidden = false;
      sheetEl.innerHTML = renderSheet(state);
    } else {
      sheetEl.hidden = true;
      sheetEl.innerHTML = '';
    }

    toastEl.className = 'toast' + (state.toast ? ' on ' + state.toast.kind : '');
    toastEl.textContent = state.toast ? state.toast.msg : '';

    restoreFocus(focus);
  };

  function captureFocus() {
    const el = document.activeElement;
    if (!el || !el.id || !viewEl || !viewEl.contains(el)) return null;
    return {
      id: el.id,
      start: typeof el.selectionStart === 'number' ? el.selectionStart : null,
      end: typeof el.selectionEnd === 'number' ? el.selectionEnd : null
    };
  }

  function restoreFocus(f) {
    if (!f) return;
    const el = document.getElementById(f.id);
    if (!el) return;
    el.focus({ preventScroll: true });
    if (f.start != null && el.setSelectionRange) {
      try { el.setSelectionRange(f.start, f.end); } catch (_) { /* not a text input */ }
    }
  }

  /* ------------------------------------------------------------------ */
  /* Chrome                                                              */
  /* ------------------------------------------------------------------ */

  function renderHead(state) {
    const app = App();
    const r = app.regionCode() ? Birdex.region(app.regionCode()) : null;
    const rank = Birdex.rankFor(app.points());
    const back = ['species', 'collection', 'photo', 'settings', 'sighting'].indexOf(state.route.name) !== -1;

    return (back
      ? '<button class="head-btn" data-act="back" aria-label="Back">' + icon('back') + '</button>'
      : '<div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>Birdex</span></div>') +
      '<button class="chip region-chip" data-act="go" data-href="#/nearby">' +
        icon('pin') + '<span>' + esc(r ? r.name : 'Set location') + '</span>' +
        (state.manualRegion ? '<em class="chip-note">manual</em>' : '') +
      '</button>' +
      '<button class="chip rank-chip" data-act="go" data-href="#/history" title="' +
        esc(rank.rank.name + ' — ' + app.points() + ' dex points') + '">' +
        '<b>' + app.points() + '</b><span>pts</span></button>';
  }

  function renderTabs(state) {
    const active = {
      dex: 'dex', species: 'dex', nearby: 'nearby', log: 'log',
      collections: 'collections', collection: 'collections',
      history: 'history', sighting: 'history', settings: 'history', photo: 'collections'
    }[state.route.name] || 'dex';

    return TABS.map(t =>
      '<button class="tab' + (active === t.name ? ' on' : '') + (t.primary ? ' primary' : '') +
      '" data-act="go" data-href="' + t.href + '"' + (active === t.name ? ' aria-current="page"' : '') + '>' +
      icon(t.icon) + '<span>' + t.label + '</span></button>'
    ).join('');
  }

  function renderView(state) {
    switch (state.route.name) {
      case 'species': return viewSpecies(state);
      case 'nearby': return viewNearby(state);
      case 'log': return viewLog(state);
      case 'collections': return viewCollections(state);
      case 'collection': return viewCollection(state);
      case 'history': return viewHistory(state);
      case 'sighting': return viewSighting(state);
      case 'photo': return viewPhoto(state);
      case 'settings': return viewSettings(state);
      default: return viewDex(state);
    }
  }

  /* ------------------------------------------------------------------ */
  /* Shared pieces                                                       */
  /* ------------------------------------------------------------------ */

  function tierChip(tier, extra) {
    return '<span class="tier" style="--tier:' + tier.color + '">' + esc(tier.name) + (extra || '') + '</span>';
  }

  /** Odds bar. Square-rooted so the rare end of the scale stays readable. */
  function oddsBar(rarity) {
    const w = rarity.pct > 0 ? Math.max(3, Math.min(100, Math.sqrt(rarity.pct / 70) * 100)) : 0;
    return '<div class="odds"><div class="odds-fill" style="width:' + w.toFixed(1) +
      '%;background:' + rarity.tier.color + '"></div></div>';
  }

  function pips(tier) {
    const idx = Birdex.tiers.indexOf(tier);
    const n = idx === -1 ? 6 : idx + 1;
    let out = '<span class="pips" aria-label="Difficulty ' + n + ' of 6">';
    for (let i = 0; i < 6; i++) {
      out += '<i class="' + (i < n ? 'on' : '') + '" style="--tier:' + tier.color + '"></i>';
    }
    return out + '</span>';
  }

  function speciesThumb(sp, opts) {
    opts = opts || {};
    const app = App();
    const seen = app.seen(sp.id);
    const photo = seen ? app.dexPhoto(sp.id) : null;
    if (photo) {
      return '<img class="thumb-img" src="' + Birdex.store.url(photo, 'thumb') + '" alt="' + esc(sp.n) + '" loading="lazy">';
    }
    /* Locked silhouettes are the point of a dex grid, but lists that already
     * spell out the name gain nothing from hiding the picture. */
    return Birdex.art.portrait(sp, { locked: !seen && !opts.reveal });
  }

  function speciesCard(sp, state, rarity) {
    const app = App();
    const seen = app.seen(sp.id);
    const rec = app.record(sp.id);
    return '<button class="card' + (seen ? ' caught' : '') + '" data-act="go" data-href="#/species/' + sp.id + '">' +
      '<div class="card-art">' + speciesThumb(sp) +
        (seen ? '<span class="card-badge" title="In your dex">' + icon('star') + '</span>' : '') +
        (rec && rec.count > 1 ? '<span class="card-count">×' + rec.count + '</span>' : '') +
      '</div>' +
      '<div class="card-name">' + esc(seen ? sp.n : '???') + '</div>' +
      '<div class="card-sub">' + (seen ? esc(sp.fam) : '#' + pad(sp.num)) + '</div>' +
      (rarity ? '<div class="card-tier">' + tierChip(rarity.tier) + '</div>' : '') +
      '</button>';
  }

  function pad(n) { return String(n).padStart(3, '0'); }

  function empty(title, body, action) {
    return '<div class="empty"><h3>' + esc(title) + '</h3><p>' + body + '</p>' + (action || '') + '</div>';
  }

  /* ------------------------------------------------------------------ */
  /* Dex                                                                 */
  /* ------------------------------------------------------------------ */

  const DEX_FILTERS = [
    { key: 'all', label: 'All' },
    { key: 'caught', label: 'In dex' },
    { key: 'missing', label: 'Missing' },
    { key: 'here', label: 'Here now' }
  ];

  function viewDex(state) {
    const app = App();
    const code = app.regionCode();
    const q = state.dexQuery.trim().toLowerCase();
    const stats = app.stats();

    let list = Birdex.all();
    if (q) list = list.filter(sp => sp.searchKey.indexOf(q) !== -1);

    if (state.dexFilter === 'caught') list = list.filter(sp => app.seen(sp.id));
    else if (state.dexFilter === 'missing') list = list.filter(sp => !app.seen(sp.id));
    else if (state.dexFilter === 'here' && code) {
      list = list.filter(sp => sp.abund[code] != null && Birdex.inSeason(sp, code, state.month));
    }

    const rarityOf = sp => code ? Birdex.rarity(sp, code, state.month) : null;

    if (state.dexFilter === 'here' && code) {
      list = list.slice().sort((a, b) => rarityOf(b).pct - rarityOf(a).pct || a.n.localeCompare(b.n));
    }

    return '<section class="pane">' +
      '<div class="dex-head">' +
        '<h1>Dex <em>' + stats.species + ' / ' + Birdex.count() + '</em></h1>' +
        '<div class="progress"><div style="width:' + (stats.species / Birdex.count() * 100).toFixed(1) + '%"></div></div>' +
        '<p class="muted small">' + stats.pctComplete + '% complete · ' + stats.points + ' dex points · ' +
          esc(Birdex.rankFor(stats.points).rank.name) + '</p>' +
      '</div>' +
      '<div class="toolbar">' +
        '<input id="dexSearch" class="search" type="search" placeholder="Search ' + Birdex.count() + ' birds, families, latin names" ' +
          'value="' + esc(state.dexQuery) + '" data-on="dex-search" autocomplete="off">' +
      '</div>' +
      '<div class="chips scroll-x">' +
        DEX_FILTERS.map(f => '<button class="chip' + (state.dexFilter === f.key ? ' on' : '') +
          '" data-act="dex-filter" data-value="' + f.key + '">' + f.label + '</button>').join('') +
      '</div>' +
      (state.dexFilter === 'here' && !code
        ? '<p class="notice">Set a location to see what is around you. <button class="link" data-act="go" data-href="#/nearby">Set location</button></p>'
        : '') +
      (list.length
        ? '<div class="grid">' + list.map(sp => speciesCard(sp, state, rarityOf(sp))).join('') + '</div>'
        : empty('Nothing matches', 'Try a different search or filter.')) +
      installBanner(state) +
      '</section>';
  }

  /* ------------------------------------------------------------------ */
  /* Species detail                                                      */
  /* ------------------------------------------------------------------ */

  function viewSpecies(state) {
    const app = App();
    const sp = Birdex.get(state.route.params.id);
    if (!sp) return empty('Unknown bird', 'That dex entry does not exist.');

    const code = app.regionCode();
    const rarity = Birdex.rarity(sp, code, state.month);
    const seen = app.seen(sp.id);
    const rec = app.record(sp.id);
    const photos = app.photosFor(sp.id);
    const hero = app.dexPhoto(sp.id);
    const isNew = state.route.params.new === '1';

    /* Where it is easiest to find — useful context when it is scarce here. */
    const best = Object.keys(sp.abund)
      .map(c => ({ code: c, level: sp.abund[c], region: Birdex.region(c) }))
      .sort((a, b) => b.level - a.level)
      .slice(0, 3);

    return '<section class="pane detail">' +
      (isNew ? '<div class="newbanner">New dex entry! <b>+' + sp.points + '</b> points</div>' : '') +
      '<div class="hero' + (hero ? ' has-photo' : '') + '">' +
        (hero
          ? '<img src="' + Birdex.store.url(hero, 'full') + '" alt="Your photo of ' + esc(sp.n) + '">'
          : Birdex.art.portrait(sp, { locked: !seen, className: 'hero-art' })) +
        '<span class="hero-num">#' + pad(sp.num) + '</span>' +
      '</div>' +

      '<div class="title-row">' +
        '<div><h1>' + esc(sp.n) + '</h1><p class="sci">' + esc(sp.sci) + '</p></div>' +
        tierChip(sp.globalTier, ' · ' + sp.points + ' pts') +
      '</div>' +
      '<p class="muted small">' + esc(sp.fam) + ' · ' + esc(sp.size) + '</p>' +

      '<div class="actions">' +
        '<button class="btn primary" data-act="log-species" data-id="' + sp.id + '">' + icon('camera') + ' Log a sighting</button>' +
        (photos.length ? '<button class="btn" data-act="sheet-dexphoto" data-id="' + sp.id + '">Set dex photo</button>' : '') +
      '</div>' +

      /* --- how hard is it, here, now --- */
      '<div class="panel">' +
        '<h2>How rare is it here?</h2>' +
        (code
          ? '<div class="rarity-row">' + tierChip(rarity.tier) + pips(rarity.tier) + '</div>' +
            oddsBar(rarity) +
            '<p class="odds-line"><b>' + esc(rarity.label) + '</b>' +
              (rarity.present ? ' · roughly <b>' + fmtPct(rarity.pct) + '</b> of outings' : '') + '</p>' +
            '<p class="muted">' + esc(rarity.detail) + '</p>' +
            '<p class="muted small">In ' + esc(Birdex.region(code).name) + ' · ' +
              esc(rarity.season.name) + ' · ' + monthName(state.month) +
              (rarity.present && !rarity.inSeason ? ' · out of season' : '') + '</p>'
          : '<p class="muted">Set your location and this becomes a real answer for where you are standing.</p>' +
            '<button class="btn" data-act="go" data-href="#/nearby">Set location</button>') +
        (best.length
          ? '<p class="muted small best-line">Best odds: ' +
            best.map(b => esc(b.region.name) + ' (' + esc(Birdex.abundance[b.level].label.toLowerCase()) + ')').join(' · ') +
            '</p>'
          : '') +
      '</div>' +

      /* --- your records --- */
      '<div class="panel">' +
        '<h2>Your records</h2>' +
        (seen
          ? '<p class="stat-line"><b>' + rec.count + '</b> sighting' + (rec.count > 1 ? 's' : '') +
              ' · first ' + Birdex.fmtDate(rec.first) + ' · latest ' + Birdex.fmtDate(rec.last) + '</p>' +
            (photos.length
              ? '<div class="strip">' + photos.map(p =>
                  '<button class="strip-item" data-act="go" data-href="#/photo/' + p.id + '">' +
                  '<img src="' + Birdex.store.url(p, 'thumb') + '" alt="Photo from ' + Birdex.fmtDate(p.ts) + '" loading="lazy">' +
                  '</button>').join('') + '</div>'
              : '<p class="muted">No photos of this one yet.</p>')
          : '<p class="muted">Not in your dex yet. Photograph one and it unlocks here.</p>') +
      '</div>' +

      /* --- field guide --- */
      '<div class="panel guide">' +
        '<h2>Field notes</h2>' +
        fact('At a glance', sp.look) +
        fact('Where they live', sp.habitat) +
        fact('Range', sp.range) +
        fact('Food', sp.food) +
        fact('Nest', sp.nest) +
        fact('Voice', sp.voice) +
        fact('Worth knowing', sp.fact) +
      '</div>' +

      '<div class="panel">' +
        '<h2>Recorded in</h2>' +
        '<div class="regionlist">' +
          Object.keys(sp.abund).sort((a, b) => sp.abund[b] - sp.abund[a]).map(c => {
            const reg = Birdex.region(c);
            const lv = sp.abund[c];
            return '<div class="regionrow' + (c === code ? ' here' : '') + '">' +
              '<span>' + esc(reg.name) + (c === code ? ' <em>· you are here</em>' : '') + '</span>' +
              '<span class="lv" style="--lv:' + (lv / 5 * 100) + '%">' + esc(Birdex.abundance[lv].label) + '</span>' +
              '</div>';
          }).join('') +
        '</div>' +
      '</div>' +
      '</section>';
  }

  function fact(label, text) {
    if (!text) return '';
    return '<div class="fact"><h3>' + esc(label) + '</h3><p>' + esc(text) + '</p></div>';
  }

  function fmtPct(p) {
    if (p >= 10) return Math.round(p) + '%';
    if (p >= 1) return p.toFixed(1) + '%';
    return p.toFixed(2) + '%';
  }

  function monthName(m) {
    return ['January', 'February', 'March', 'April', 'May', 'June', 'July',
      'August', 'September', 'October', 'November', 'December'][m - 1];
  }

  /* ------------------------------------------------------------------ */
  /* Nearby                                                              */
  /* ------------------------------------------------------------------ */

  const NEARBY_FILTERS = [
    { key: 'all', label: 'All' },
    { key: 'need', label: 'Still need' },
    { key: 'have', label: 'In dex' },
    { key: 'season', label: 'In season' },
    { key: 'rare', label: 'Rare here' }
  ];

  function viewNearby(state) {
    const app = App();
    const code = app.regionCode();
    const region = code ? Birdex.region(code) : null;

    let rows = code ? Birdex.speciesForRegion(code, state.month) : [];
    const total = rows.length;
    const found = rows.filter(r => app.seen(r.sp.id)).length;

    if (state.nearbyFilter === 'need') rows = rows.filter(r => !app.seen(r.sp.id));
    else if (state.nearbyFilter === 'have') rows = rows.filter(r => app.seen(r.sp.id));
    else if (state.nearbyFilter === 'season') rows = rows.filter(r => r.rarity.inSeason);
    else if (state.nearbyFilter === 'rare') rows = rows.filter(r => r.rarity.tier.pts >= 90);

    return '<section class="pane">' +
      '<h1>Nearby</h1>' +

      '<div class="panel loc">' +
        (region
          ? '<h2 class="loc-name">' + esc(region.name) + '</h2><p class="muted">' + esc(region.blurb) + '</p>'
          : '<h2 class="loc-name">Where are you?</h2><p class="muted">Birdex works out which birds are around you, and how hard each one is to find, from your region and the month.</p>') +

        (state.geo
          ? '<p class="muted small">' + state.geo.lat.toFixed(3) + ', ' + state.geo.lng.toFixed(3) +
            (state.geo.acc ? ' · ±' + Math.round(state.geo.acc) + ' m' : '') +
            (state.regionExact ? '' : ' · nearest region') +
            ' · ' + Birdex.fmtDate(state.geo.ts) + '</p>'
          : '') +
        (state.geoError ? '<p class="notice">' + esc(state.geoError) + '</p>' : '') +

        '<div class="actions">' +
          '<button class="btn primary" data-act="locate">' +
            (state.geoStatus === 'locating' ? 'Locating…' : 'Use my location') + '</button>' +
        '</div>' +
        '<label class="field"><span>Or pick a region</span>' +
          '<select id="regionPick" data-on="region-pick">' +
            '<option value="">Use my location</option>' +
            Birdex.regions.map(r => '<option value="' + r.code + '"' +
              (state.manualRegion === r.code ? ' selected' : '') + '>' + esc(r.name) + '</option>').join('') +
          '</select></label>' +
      '</div>' +

      (region
        ? '<div class="panel tight">' +
            '<p class="stat-line"><b>' + total + '</b> species recorded here · you have <b>' + found + '</b>' +
            ' · ' + monthName(state.month) + '</p>' +
          '</div>' +
          '<div class="chips scroll-x">' +
            NEARBY_FILTERS.map(f => '<button class="chip' + (state.nearbyFilter === f.key ? ' on' : '') +
              '" data-act="nearby-filter" data-value="' + f.key + '">' + f.label + '</button>').join('') +
          '</div>' +
          (rows.length
            ? '<ul class="rows">' + rows.map(r => nearbyRow(r, app)).join('') + '</ul>'
            : empty('Nothing here', 'No species match that filter in this region.'))
        : '') +
      '</section>';
  }

  function nearbyRow(r, app) {
    const sp = r.sp, seen = app.seen(sp.id);
    return '<li><button class="row" data-act="go" data-href="#/species/' + sp.id + '">' +
      '<span class="row-art">' + speciesThumb(sp, { reveal: true }) + '</span>' +
      '<span class="row-main">' +
        '<span class="row-name">' + esc(sp.n) + (seen ? ' <i class="dot" title="In your dex"></i>' : '') + '</span>' +
        '<span class="row-sub">' + esc(sp.fam) + ' · ' + esc(r.rarity.label) + '</span>' +
        oddsBar(r.rarity) +
      '</span>' +
      '<span class="row-tier">' + tierChip(r.rarity.tier) + '<em>' + fmtPct(r.rarity.pct) + '</em></span>' +
      '</button></li>';
  }

  /* ------------------------------------------------------------------ */
  /* Log a sighting                                                      */
  /* ------------------------------------------------------------------ */

  function viewLog(state) {
    const app = App();
    const code = app.regionCode();
    const p = state.pending;
    const chosen = p.speciesId ? Birdex.get(p.speciesId) : null;
    const q = (p.query || '').trim().toLowerCase();

    let suggestions;
    if (q) {
      suggestions = Birdex.all().filter(sp => sp.searchKey.indexOf(q) !== -1).slice(0, 40)
        .map(sp => ({ sp, rarity: code ? Birdex.rarity(sp, code, state.month) : null }));
    } else {
      suggestions = Birdex.suggestions(code, state.month, 30);
    }

    const when = p.ts ? new Date(p.ts) : new Date();

    return '<section class="pane">' +
      '<h1>Log a sighting</h1>' +
      '<p class="muted">Photos stay on this device. Nothing is uploaded.</p>' +

      '<div class="panel">' +
        '<h2>1 · Photos</h2>' +
        '<div class="pending">' +
          p.photos.map((ph, i) =>
            '<div class="pending-item">' +
              '<img src="' + ph.url + '" alt="Photo ' + (i + 1) + '">' +
              '<button class="x" data-act="remove-pending" data-index="' + i + '" aria-label="Remove photo">×</button>' +
            '</div>').join('') +
          '<label class="pending-add">' + icon('camera') + '<span>Camera</span>' +
            '<input type="file" accept="image/*" capture="environment" multiple data-on="pick-photo"></label>' +
          '<label class="pending-add">' + icon('album') + '<span>Library</span>' +
            '<input type="file" accept="image/*" multiple data-on="pick-photo"></label>' +
        '</div>' +
        '<p class="muted small">A sighting can be logged without a photo, but a photo is what unlocks the dex art.</p>' +
      '</div>' +

      '<div class="panel">' +
        '<h2>2 · Which bird?</h2>' +
        (chosen
          ? '<div class="chosen">' +
              '<span class="chosen-art">' + Birdex.art.portrait(chosen, { reveal: true }) + '</span>' +
              '<span class="chosen-main"><b>' + esc(chosen.n) + '</b><em>' + esc(chosen.sci) + '</em>' +
                (code ? '<span class="muted small">' + esc(Birdex.rarity(chosen, code, state.month).label) +
                  ' in ' + esc(Birdex.region(code).name) + '</span>' : '') +
              '</span>' +
              '<button class="btn small" data-act="clear-species">Change</button>' +
            '</div>'
          : '<input id="logSearch" class="search" type="search" placeholder="Search by name, family or latin name" ' +
              'value="' + esc(p.query || '') + '" data-on="log-search" autocomplete="off">' +
            (code
              ? (q ? '' : '<p class="muted small">Ranked by what is likely where you are right now.</p>')
              : '<p class="muted small">Set a location and this list gets ranked by what is actually around you.</p>') +
            '<ul class="rows compact">' + suggestions.map(s =>
              '<li><button class="row" data-act="pick-species" data-id="' + s.sp.id + '">' +
                '<span class="row-art">' + Birdex.art.portrait(s.sp, { reveal: true }) + '</span>' +
                '<span class="row-main"><span class="row-name">' + esc(s.sp.n) + '</span>' +
                  '<span class="row-sub">' + esc(s.sp.fam) + (s.rarity ? ' · ' + esc(s.rarity.label) : '') + '</span></span>' +
                (s.rarity ? '<span class="row-tier">' + tierChip(s.rarity.tier) + '</span>' : '') +
              '</button></li>').join('') + '</ul>') +
      '</div>' +

      '<div class="panel">' +
        '<h2>3 · When and where</h2>' +
        '<label class="field"><span>Date and time</span>' +
          '<input id="logWhen" type="datetime-local" value="' + localInputValue(when) + '" data-on="when"></label>' +
        '<p class="muted small">' +
          (code
            ? 'Location: ' + esc(Birdex.region(code).name) + (state.manualRegion ? ' (picked by hand)' : '') +
              (state.geo ? ' · ' + state.geo.lat.toFixed(3) + ', ' + state.geo.lng.toFixed(3) : '')
            : 'No location set — the sighting will be saved without one.') +
        '</p>' +
        '<div class="actions"><button class="btn small" data-act="locate">' +
          (state.geoStatus === 'locating' ? 'Locating…' : 'Update location') + '</button></div>' +
        '<label class="field"><span>How many?</span>' +
          '<input id="logCount" type="number" min="1" max="9999" value="' + esc(p.count) + '" data-on="count"></label>' +
        '<label class="field"><span>Notes</span>' +
          '<textarea id="logNotes" rows="3" placeholder="Behaviour, habitat, who you were with…" data-on="notes">' +
            esc(p.notes) + '</textarea></label>' +
      '</div>' +

      '<div class="actions sticky">' +
        '<button class="btn primary big" data-act="save-sighting"' + (chosen ? '' : ' disabled') + '>' +
          (chosen ? 'Save sighting' : 'Pick a bird to save') + '</button>' +
      '</div>' +
      '</section>';
  }

  function localInputValue(d) {
    const p = n => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
      'T' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  /* ------------------------------------------------------------------ */
  /* Collections                                                         */
  /* ------------------------------------------------------------------ */

  function viewCollections(state) {
    const app = App();
    const cols = state.collections;

    return '<section class="pane">' +
      '<h1>Album</h1>' +
      '<p class="muted">Collections are hand-picked sets of your photos — a best-of, a trip, a patch.</p>' +
      '<div class="actions"><button class="btn primary" data-act="new-collection">New collection</button></div>' +
      (cols.length
        ? '<div class="grid two">' + cols.map(c => {
            const cover = c.cover ? app.photo(c.cover) : (c.photoIds.length ? app.photo(c.photoIds[0]) : null);
            return '<button class="card col-card" data-act="go" data-href="#/collection/' + c.id + '">' +
              '<div class="card-art">' +
                (cover
                  ? '<img class="thumb-img" src="' + Birdex.store.url(cover, 'thumb') + '" alt="" loading="lazy">'
                  : '<div class="col-empty">' + icon('album') + '</div>') +
              '</div>' +
              '<div class="card-name">' + esc(c.name) + '</div>' +
              '<div class="card-sub">' + c.photoIds.length + ' photo' + (c.photoIds.length === 1 ? '' : 's') + '</div>' +
              '</button>';
          }).join('') + '</div>'
        : empty('No collections yet', 'Make one, then add the shots you are proud of.')) +

      '<div class="panel">' +
        '<h2>All your photos <em class="muted">' + state.photos.length + '</em></h2>' +
        (state.photos.length
          ? '<div class="photogrid">' + state.photos.map(p =>
              '<button class="ph" data-act="go" data-href="#/photo/' + p.id + '">' +
                '<img src="' + Birdex.store.url(p, 'thumb') + '" alt="" loading="lazy">' +
                '<span>' + esc(shortName(p.speciesId)) + '</span>' +
              '</button>').join('') + '</div>'
          : '<p class="muted">Photos you attach to sightings show up here.</p>') +
      '</div>' +
