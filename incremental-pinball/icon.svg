<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Tower of Chips mark: a lighthouse of brown levels, a ball, and a flipper.

    Designed at 32px first, because that is where an app icon actually lives.
    What makes it read as a lighthouse rather than a striped block:
      · the LANTERN — a glazed room under a dark cap, wider than the shaft it
        sits on, with a gallery rail under it. This is the whole silhouette
        cue; without it a banded taper is just a barber's pole.
      · the BEAM — one wedge of light leaving the lantern. Kept to a single
        wide wedge: two beams read as a bow tie once scaled down.
      · the FLARE at the base, so the tower stands on something.
    The bands are the game's own floor browns, alternating light and dark.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#31474f"/>
      <stop offset="1" stop-color="#131b20"/>
    </linearGradient>
    <radialGradient id="orb" cx="34%" cy="28%" r="74%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="52%" stop-color="#f4ead6"/>
      <stop offset="1" stop-color="#a99e86"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb61e" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffb61e" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="shaft">
      <path d="M152 420 L360 420 L330 176 L182 176 Z"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#sky)"/>

  <!-- Everything inside one group so the composition can be fitted to the
       frame in one place. At full size the base flare and the flipper pivot
       were clipped by the rounded corners. -->
  <g transform="translate(256 262) scale(0.86) translate(-256 -256)">
  <!-- beam, behind everything -->
  <path d="M262 132 L492 60 L492 216 Z" fill="url(#beam)"/>

  <!-- lantern room: wider than the shaft, which is the lighthouse cue -->
  <path d="M196 116 L316 116 L316 168 L196 168 Z" fill="#ffb61e" stroke="#0a0d11" stroke-width="15" stroke-linejoin="round"/>
  <path d="M186 96 L326 96 L306 62 L206 62 Z" fill="#4e2917" stroke="#0a0d11" stroke-width="15" stroke-linejoin="round"/>
  <rect x="180" y="162" width="152" height="20" rx="9" fill="#5b4936" stroke="#0a0d11" stroke-width="14"/>

  <!-- shaft, banded in the game's floor browns -->
  <path d="M152 420 L360 420 L330 176 L182 176 Z" fill="#22150c"/>
  <g clip-path="url(#shaft)">
    <rect x="130" y="360" width="260" height="44" fill="#9b5d27"/>
    <rect x="130" y="272" width="260" height="44" fill="#7b6647"/>
    <rect x="130" y="184" width="260" height="44" fill="#803920"/>
  </g>
  <path d="M152 420 L360 420 L330 176 L182 176 Z" fill="none" stroke="#0a0d11" stroke-width="17" stroke-linejoin="round"/>

  <!-- base flare, so the tower stands on something -->
  <path d="M134 460 L378 460 L360 416 L152 416 Z" fill="#5b4936" stroke="#0a0d11" stroke-width="15" stroke-linejoin="round"/>

  <!-- ball, against the sky and clear of the tower outline -->
  <circle cx="424" cy="272" r="54" fill="#0a0d11"/>
  <circle cx="424" cy="272" r="44" fill="url(#orb)"/>
  <circle cx="409" cy="256" r="13" fill="#ffffff" opacity=".92"/>

  <!-- flipper, mid-swing along the ball's path -->
  <path d="M118 462 L236 430" stroke="#0a0d11" stroke-width="60" stroke-linecap="round"/>
  <path d="M118 462 L236 430" stroke="#ffb61e" stroke-width="36" stroke-linecap="round"/>
  <circle cx="118" cy="462" r="18" fill="#0a0d11"/>
  <circle cx="118" cy="462" r="8" fill="#ffb61e"/>
  </g>
</svg>
