<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Tower of Chips mark: a flipper firing a ball up a tower of levels.

    Designed at 32px first, because that is where an app icon actually lives.
    Three shapes, nothing else:

      · TOWER — a barely-tapered block with a narrower crown. A strong taper
        reads as a traffic cone, and no taper at all reads as a door.
      · LEVELS — four solid colour bands. Earlier versions cut "openings" into
        them to echo the real table; at icon size a band with a hole in it does
        not read as an opening, it reads as a broken stripe, so they are gone.
      · BALL and FLIPPER — the ball is the brightest thing on the mark and sits
        against the sky clear of the tower outline; the flipper sits below the
        base, angled along the ball's path.

    A dotted trajectory was tried and dropped: any dash pattern fine enough to
    look like a trail turns into speckle once scaled down.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#31474f"/>
      <stop offset="1" stop-color="#131b20"/>
    </linearGradient>
    <radialGradient id="orb" cx="34%" cy="28%" r="74%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="52%" stop-color="#f4ead6"/>
      <stop offset="1" stop-color="#a99e86"/>
    </radialGradient>
    <clipPath id="body">
      <path d="M140 414 L372 414 L350 150 L162 150 Z"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#sky)"/>

  <!-- crown: the narrower cap is what makes the block read as a tower -->
  <path d="M176 152 L336 152 L322 96 L190 96 Z" fill="#f4ead6"
        stroke="#0a0d11" stroke-width="16" stroke-linejoin="round"/>

  <!-- tower body, four levels -->
  <path d="M140 414 L372 414 L350 150 L162 150 Z" fill="#1d272d"/>
  <g clip-path="url(#body)">
    <rect x="120" y="356" width="280" height="38" fill="#ff8b32"/>
    <rect x="120" y="292" width="280" height="38" fill="#ff6fd8"/>
    <rect x="120" y="228" width="280" height="38" fill="#41c98a"/>
    <rect x="120" y="164" width="280" height="38" fill="#2fd5d0"/>
  </g>
  <path d="M140 414 L372 414 L350 150 L162 150 Z" fill="none"
        stroke="#0a0d11" stroke-width="17" stroke-linejoin="round"/>

  <!-- ball, against the sky and clear of the tower outline -->
  <circle cx="420" cy="200" r="58" fill="#0a0d11"/>
  <circle cx="420" cy="200" r="47" fill="url(#orb)"/>
  <circle cx="404" cy="183" r="14" fill="#ffffff" opacity=".92"/>

  <!-- flipper, mid-swing along the ball's path -->
  <path d="M146 456 L282 416" stroke="#0a0d11" stroke-width="64" stroke-linecap="round"/>
  <path d="M146 456 L282 416" stroke="#ffb61e" stroke-width="40" stroke-linecap="round"/>
  <circle cx="146" cy="456" r="20" fill="#0a0d11"/>
  <circle cx="146" cy="456" r="9" fill="#ffb61e"/>
</svg>
