<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Tilt Seq</title>
  <meta name="description" content="A pocket two-screen step sequencer: drum maker, S2K sampler bass, dual-osc synth, tilt Kaoss pad, song chains and WAV/MP3 export, all synthesized in the browser." />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0d0e10" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tilt Seq" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
  <style>
    /* Two-screen handheld: an LCD "top screen" that only displays, a hinge with
       the transport, and a touch "bottom screen" with the editors. Flat pixel
       bevels, no gradients. */
    :root { --bg:#0d0e10; --shell:#2b2e33; --shell2:#222529; --edge:#3d4147; --panel:#15171a; --cell:#24282e;
      --line:#383d45; --txt:#e9e4d4; --dim:#80848b; --or:#ff6a13; --gr:#9cf06a; --am:#ffb347; --cy:#6ad6f0; --rd:#ff4a3a; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--txt);
      font-family: "VT323", ui-monospace, Menlo, Consolas, monospace; font-size: 18px; line-height: 1;
      user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; touch-action: manipulation; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    #dev { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      padding: calc(env(safe-area-inset-top, 0px) + 6px) 8px calc(env(safe-area-inset-bottom, 0px) + 6px); }
    #dev > * { width: 100%; max-width: 480px; }

    #topshell { background: var(--shell); border: 2px solid var(--edge); border-bottom: 0; border-radius: 12px 12px 0 0; padding: 8px 10px; }
    #topscr { background: #0b130d; outline: 2px solid #000; height: clamp(110px, 25vh, 230px); display: grid; place-items: center; overflow: hidden; }
    #top { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }

    #hinge { background: var(--shell2); border: 2px solid var(--edge); display: flex; gap: 4px; padding: 5px 6px; align-items: stretch; }
    #hinge .b { height: 38px; min-width: 40px; padding: 0 8px; }
    #bKit { min-width: 70px !important; color: var(--or); }
    #hinge .sp { flex: 1; }

    #botshell { flex: 1; min-height: 0; background: var(--shell); border: 2px solid var(--edge); border-top: 0; border-radius: 0 0 12px 12px;
      padding: 6px 10px 10px; display: flex; flex-direction: column; }
    #bot { flex: 1; min-height: 0; background: var(--panel); outline: 2px solid #000; display: flex; flex-direction: column; }
    #panel { flex: 1; min-height: 0; overflow: hidden; padding: 6px; display: flex; flex-direction: column; gap: 5px; }
    .fill { flex: 1 1 0; min-height: 0; }
    #bot { position: relative; }
    #status { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); padding: 4px 8px 3px; font-size: 16px; color: var(--am); background: #000; border: 1px solid var(--line); white-space: nowrap; pointer-events: none; z-index: 5; }
    #status:empty { display: none; }

    /* pixel bevel buttons */
    .b { display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-height: 30px; padding: 0 8px;
      background: #2c3036; border: 2px solid #000; box-shadow: inset 2px 2px 0 #4b5058, inset -2px -2px 0 #1b1d21; color: var(--txt); white-space: nowrap; }
    .b:active, .b.dn { box-shadow: inset 2px 2px 0 #1b1d21, inset -2px -2px 0 #3a3f46; }
    .b.on { background: var(--or); color: #000; box-shadow: inset 2px 2px 0 #ffa165, inset -2px -2px 0 #a8420a; }
    .b.dis { opacity: .35; pointer-events: none; }
    .b.w { flex: 1; }

    .row { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; flex: none; }
    .row.nw { flex-wrap: nowrap; }
    .lbl { color: var(--dim); font-size: 16px; }
    .sp { flex: 1; }

    .pick { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .b.pl { box-shadow: inset 0 -4px 0 var(--gr); }

    /* step grids */
    .grid { display: grid; gap: 2px; touch-action: none; align-content: start; }
    .ga { grid-template-columns: 14px repeat(16, 1fr); }
    .sw { min-height: 0; background: var(--sc); opacity: .7; }
    .ga.mel { --sc: var(--cy); } .ga.bass { --sc: var(--am); } .ga.drum { --sc: var(--gr); }
    .ga .c.on { background: var(--sc); }
    .c.on.ph { filter: brightness(1.3); }
    .c { min-height: 0; background: var(--cell); }
    .c.q4 { background: #2e333a; }
    .c.ph { outline: 2px solid var(--or); outline-offset: -2px; }

    /* knobs */






    #modal { position: fixed; inset: 0; background: rgba(0,0,0,.72); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
    #modal[hidden] { display: none; }
    .mbox { width: 100%; max-width: 380px; background: var(--panel); border: 2px solid #000; outline: 2px solid var(--or); padding: 10px; max-height: 90vh; overflow: hidden; display: flex; flex-direction: column; gap: 4px; }
    .mbox h3 { font-weight: 400; color: var(--or); letter-spacing: 2px; margin-bottom: 8px; }
    .mbox audio { width: 100%; margin: 6px 0; }
    .mgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; flex: none; }
    input[type=file] { display: none; }
  </style>
</head>
<body>
<div id="dev">
  <div id="topshell">
    <div id="topscr"><canvas id="top" width="240" height="144"></canvas></div>
  </div>
  <div id="hinge">
    <button class="b" id="bPlay" aria-label="Play">&#9654;</button>
    <button class="b" id="bSpeed" aria-label="Speed"></button>
    <button class="b" id="bKit" aria-label="Sound"></button>
    <span class="sp"></span>
    <button class="b" id="bTilt">TILT</button>
    <button class="b" id="bMenu" aria-label="Menu">&#9776;</button>
  </div>
  <div id="botshell">
    <div id="bot">
      <div id="panel"></div>
      <div id="status"></div>
    </div>
  </div>
</div>
<div id="modal" hidden></div>
<input type="file" id="fileIn" accept=".json,.tseq,application/json,text/plain" />
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const midiHz = n => 440 * Math.pow(2, (n - 69) / 12);

// ───────────────────────── instrument parameters ─────────────────────────
// Every instrument parameter is stored normalized 0..1 and mapped at play time,
// so tilt / automation can offset any of them the same way.
const PDEF = {
  drum: [['tune','TUNE',.5],['decay','DECAY',.5],['tone','TONE',.5],['snap','SNAP',.5]],
  bass: [['cutoff','CUTOFF',.4],['reso','RESO',.3],['env','ENV',.45],['decay','DECAY',.35],
         ['sub','SUB',.55],['drive','DRIVE',.3],['sustain','SUSTN',.6],['release','RELS',.15],
         ['glide','GLIDE',.3],['gate','GATE',.75]],
  synth: [['wave','WAVE1',0],['wave2','WAVE2',.3],['oct2','OSC2',.3],['detune','DETUNE',.3],
          ['mix2','MIX2',.5],['cutoff','CUTOFF',.5],['reso','RESO',.3],['env','ENV',.4],
          ['decay','DECAY',.35],['attack','ATTACK',0],['sustain','SUSTN',.6],['release','RELS',.2],
          ['glide','GLIDE',.3],['gate','GATE',.6],['drive','DRIVE',.1]],
};
const DRUM_DEF = {
  kick: { tune:.35, decay:.45, tone:.4, snap:.3 }, snare: { tune:.5, decay:.4, tone:.55, snap:.6 },
  chat: { tune:.5, decay:.25, tone:.5, snap:.3 },  ohat: { tune:.5, decay:.45, tone:.5, snap:.3 },
};
const WAVES = ['sawtooth','square','triangle','sine'];
const OCT2 = [-12, 0, 7, 12];
const q4 = v => Math.min(3, Math.floor(v * 4));

const PRESETS = {
  bass: {
    'S2K SUB':   { cutoff:.3,  reso:.15, env:.3,  decay:.5,  sub:.85, drive:.3,  sustain:.8, release:.2,  glide:.35, gate:.9 },
    'S2K WARM':  { cutoff:.4,  reso:.3,  env:.45, decay:.35, sub:.55, drive:.3,  sustain:.6, release:.15, glide:.3,  gate:.75 },
    'S2K PLUCK': { cutoff:.36, reso:.4,  env:.62, decay:.22, sub:.5,  drive:.4,  sustain:.2, release:.1,  glide:.2,  gate:.55 },
    'S2K GROWL': { cutoff:.26, reso:.62, env:.7,  decay:.45, sub:.4,  drive:.85, sustain:.5, release:.12, glide:.4,  gate:.8 },
  },
  synth: {
    'ACID':  { wave:0, wave2:0, oct2:.3, detune:0, mix2:0, cutoff:.24, reso:.86, env:.66, decay:.28, attack:0, sustain:0, release:.08, glide:.32, gate:.5, drive:.55 },
    'LEAD':  { wave:.3, wave2:0, oct2:.6, detune:.35, mix2:.6, cutoff:.55, reso:.3, env:.35, decay:.4, attack:.05, sustain:.7, release:.25, glide:.25, gate:.7, drive:.2 },
    'PAD':   { wave:0, wave2:0, oct2:.3, detune:.6, mix2:.8, cutoff:.42, reso:.15, env:.2, decay:.6, attack:.6, sustain:.85, release:.6, glide:.2, gate:1, drive:0 },
    'STAB':  { wave:.3, wave2:0, oct2:.6, detune:.2, mix2:.7, cutoff:.5, reso:.45, env:.5, decay:.2, attack:0, sustain:0, release:.18, glide:0, gate:.4, drive:.3 },
  },
};

// ───────────────────────── toy model ─────────────────────────
// Fixed rows, all tuned to C minor pentatonic so any tap sounds good:
// 6 melody notes, 3 bass notes, 4 drums. Each row is its own track.
const ROWS = [
  ...[72, 70, 67, 65, 63, 60].map(note => ({ kind: 'mel', note })),
  ...[43, 39, 36].map(note => ({ kind: 'bass', note })),
  ...['chat', 'clap', 'snare', 'kick'].map(voice => ({ kind: 'drum', voice })),
];
const SECTIONS = [['mel', 0, 6], ['bass', 6, 9], ['drum', 9, 13]];
const MAXL = 32, SPEEDS = [90, 120, 150];
const emptyLoop = () => Array(16).fill(0);
const synthP = over => { const p = {}; PDEF.synth.forEach(([k, , d]) => p[k] = d); return Object.assign(p, over); };
const bassP = over => { const p = {}; PDEF.bass.forEach(([k, , d]) => p[k] = d); return Object.assign(p, over); };
// A kit swaps every row's sound at once.
const KITS = [
  { name: 'S2K',
    mel: { type: 'synth', p: synthP({ wave: .3, wave2: 0, oct2: .6, detune: .2, mix2: .5, cutoff: .55, reso: .25, env: .35, decay: .25, sustain: .2, release: .25, gate: .5, drive: .1 }), vol: .5, send: .35 },
    bass: { type: 'bass', p: bassP(PRESETS.bass['S2K SUB']), vol: .85 },
    drum: { kick: { tune: .4, decay: .35, tone: .45, snap: .45 }, snare: { tune: .66, decay: .32, tone: .6, snap: .75 }, clap: {}, chat: { decay: .2 } } },
  { name: 'ACID',
    mel: { type: 'synth', p: synthP(PRESETS.synth.LEAD), vol: .45, send: .4 },
    bass: { type: 'synth', p: synthP(PRESETS.synth.ACID), vol: .7 },
    drum: { kick: { tune: .38, decay: .4, tone: .5, snap: .4 }, snare: {}, clap: {}, chat: { decay: .15 } } },
  { name: '8BIT',
    mel: { type: 'synth', p: synthP({ wave: .3, wave2: .3, oct2: .6, detune: 0, mix2: .3, cutoff: .8, reso: 0, env: .1, decay: .2, sustain: .5, release: .05, gate: .45, drive: 0 }), vol: .55, send: .2 },
    bass: { type: 'synth', p: synthP({ wave: .55, wave2: .3, oct2: .3, detune: 0, mix2: .4, cutoff: .7, reso: 0, env: .1, decay: .2, sustain: .7, release: .05, gate: .6, drive: 0 }), vol: .75 },
    drum: { kick: { tune: .55, decay: .2, tone: .7, snap: .1 }, snare: { tune: .7, decay: .2, tone: .8, snap: .9 }, clap: { decay: .2 }, chat: { decay: .08, tone: .8 } } },
  { name: 'DREAM',
    mel: { type: 'synth', p: synthP({ wave: .55, wave2: 0, oct2: .6, detune: .5, mix2: .4, cutoff: .5, reso: .15, env: .25, decay: .5, attack: .25, sustain: .6, release: .55, gate: .8, drive: 0 }), vol: .45, send: .6 },
    bass: { type: 'bass', p: bassP(PRESETS.bass['S2K WARM']), vol: .8 },
    drum: { kick: { tune: .3, decay: .55, tone: .3, snap: .1 }, snare: { tune: .4, decay: .5, tone: .3, snap: .4 }, clap: { decay: .6 }, chat: { decay: .3, tone: .3 } } },
];
let UID = 1;
// Build the 13 row-tracks for a kit, keeping existing step data.
function kitTracks(k, pats, len) {
  const K = KITS[k];
  return ROWS.map((r, i) => {
    const src = pats && pats[i], t = { id: UID++, type: 'drum', voice: null, p: {}, vol: .7, pan: 0, mute: false, send: 0, note: r.note,
      pats: Array.from({ length: len }, (_, l) => emptyLoop().map((z, s) => src && src[l] && src[l][s] ? (r.kind === 'drum' ? 1 : [r.note, 0, 0]) : 0)) };
    if (r.kind === 'drum') {
      t.voice = r.voice; PDEF.drum.forEach(([key, , d]) => t.p[key] = d);
      Object.assign(t.p, DRUM_DEF[r.voice] || {}, K.drum[r.voice] || {});
      t.vol = r.voice === 'chat' ? .5 : r.voice === 'kick' ? .85 : .65;
    } else {
      const S = K[r.kind];
      t.type = S.type; t.p = Object.assign({}, S.p); t.vol = S.vol; t.send = S.send || 0;
    }
    return t;
  });
}
function mkProject(k) { return { fmt: 'tiltseq', v: 3, name: 'TOY', kit: k || 0, speed: 1, bpm: SPEEDS[1], swing: 0, len: 1,
  master: { vol: .85, cut: .5, res: .1, dtime: 3, dfb: .35, dmix: .8 }, tracks: kitTracks(k || 0, null, 1) }; }
// Validate a saved/imported toy beat (v3); older formats start fresh.
function fixProject(src) {
  if (!src || src.v !== 3 || !Array.isArray(src.tracks)) return null;
  const k = clamp(src.kit | 0, 0, KITS.length - 1), len = clamp(src.len | 0, 1, MAXL);
  const P = mkProject(k);
  P.speed = clamp(src.speed | 0, 0, SPEEDS.length - 1); P.bpm = SPEEDS[P.speed]; P.len = len;
  P.tracks = kitTracks(k, src.tracks.slice(0, ROWS.length).map(t => t && t.pats), len);
  return P;
}

// ───────────────────────── demo beats ─────────────────────────
// Each loop: 13 rows of 16 steps, top to bottom (melody, bass, drums).
const DEMOS = [
  { kit: 0, speed: 2, loops: [
    ['................','................','x.......x.......','................','....x.......x...','................',
     '................','..........x.....','x.x.....x.......',
     'x.x.x.x.x.x.x.x.','................','....x.......x...','x.x.......x.....'],
    ['..........x.....','........x.......','x...............','....x...........','................','..............x.',
     'x...............','........x.......','....x.......x...',
     'x.x.x.x.x.x.x.x.','................','....x..x....x.xx','x.x.......xx....'] ] },
  { kit: 1, speed: 1, loops: [
    ['................','................','......x.........','..........x.....','................','x...............',
     'x.x...x...x.x...','................','....x.......x..x',
     '..x...x...x...x.','....x.......x...','................','x...x...x...x...'],
    ['x...............','..x.............','....x.....x.....','......x.........','........x.......','............x...',
     'x.x...x...x.x...','.....x..........','....x.......x..x',
     '..x...x...x...x.','....x.......x...','...............x','x...x...x...x...'] ] },
  { kit: 3, speed: 0, loops: [
    ['................','....x...........','x...........x...','........x.......','................','................',
     '................','................','x.......x.......',
     'x.x.x.x.x.x.x.x.','................','....x.......x...','x......x..x.....'],
    ['x...............','................','....x.......x...','................','........x.......','..............x.',
     '................','x...............','........x.......',
     'x.x.x.x.x.x.x.x.','............x...','....x.......x...','x......x..x.....'] ] },
];
function demoProject(i) {
  const D = DEMOS[i], P = mkProject(D.kit);
  P.speed = D.speed; P.bpm = SPEEDS[D.speed]; P.len = D.loops.length; P.name = KITS[D.kit].name;
  const pats = ROWS.map((r, ri) => D.loops.map(L => [...L[ri]].map(c => c === 'x' ? 1 : 0)));
  P.tracks = kitTracks(D.kit, pats, P.len);
  return P;
}


// ───────────────────────── audio engine ─────────────────────────
const AC = window.AudioContext || window.webkitAudioContext;
const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
const NOISE = new WeakMap(), S2KBUF = new WeakMap(), CURVES = new Map();
const cutHz = v => 30 * Math.pow(2, v * 9.3);

function noiseBuf(c) {
  let b = NOISE.get(c);
  if (!b) {
    b = c.createBuffer(1, c.sampleRate * 2, c.sampleRate);
    const d = b.getChannelData(0); let s = 1234567;
    for (let i = 0; i < d.length; i++) { s = (s * 16807) % 2147483647; d[i] = s / 1073741823.5 - 1; }
    NOISE.set(c, b);
  }
  return b;
}
function nz(c, t, dur) {
  const s = c.createBufferSource(); s.buffer = noiseBuf(c); s.loop = true;
  s.start(t, (t * 0.618) % 1.5); s.stop(t + dur + 0.02);
  return s;
}
function curve(k) {
  const key = Math.round(k * 20);
  let a = CURVES.get(key);
  if (!a) {
    a = new Float32Array(1024); const amt = 0.5 + key / 20 * 10, nrm = Math.tanh(amt);
    for (let i = 0; i < 1024; i++) a[i] = Math.tanh((i / 1023 * 2 - 1) * amt) / nrm;
    CURVES.set(key, a);
  }
  return a;
}
// Exponential AD envelope on a gain param.
function ad(g, t, peak, a, d) {
  g.setValueAtTime(0.0001, t);
  g.exponentialRampToValueAtTime(Math.max(peak, 0.0002), t + a);
  g.exponentialRampToValueAtTime(0.0001, t + a + d);
}
const gainNode = (c, v) => { const g = c.createGain(); g.gain.value = v; return g; };
const filt = (c, type, f, q) => { const n = c.createBiquadFilter(); n.type = type; n.frequency.value = f; n.Q.value = q == null ? 0.7 : q; return n; };

// 808/909-flavoured drum voices: (ctx, out, time, velocity, params)
const V = {
  kick(c, o, t, v, p) {
    const f1 = 38 + p.tune * 50, f0 = f1 * (2.5 + p.tone * 6), dec = 0.12 + p.decay * p.decay * 1.4;
    const os = c.createOscillator(), g = c.createGain();
    os.frequency.setValueAtTime(f0, t); os.frequency.exponentialRampToValueAtTime(f1, t + 0.03 + p.tone * 0.05);
    ad(g.gain, t, v, 0.002, dec); os.connect(g).connect(o); os.start(t); os.stop(t + dec + 0.05);
    if (p.snap > 0.02) { const n = nz(c, t, 0.02), h = filt(c, 'highpass', 1800), ng = c.createGain(); ad(ng.gain, t, v * p.snap * 0.5, 0.001, 0.012); n.connect(h).connect(ng).connect(o); }
  },
  snare(c, o, t, v, p) {
    const f = 150 + p.tune * 170, os = c.createOscillator(), g = c.createGain(); os.type = 'triangle';
    os.frequency.setValueAtTime(f * 1.6, t); os.frequency.exponentialRampToValueAtTime(f, t + 0.03);
    const td = 0.06 + p.decay * 0.14; ad(g.gain, t, v * (1 - p.snap * 0.55), 0.001, td);
    os.connect(g).connect(o); os.start(t); os.stop(t + td + 0.05);
    const nd = 0.08 + p.decay * 0.35, n = nz(c, t, nd + 0.05), h = filt(c, 'highpass', 900 + p.tone * 3500), ng = c.createGain();
    ad(ng.gain, t, v * (0.35 + p.snap * 0.75), 0.001, nd); n.connect(h).connect(ng).connect(o);
  },
  clap(c, o, t, v, p) {
    const n = nz(c, t, 0.7), bp = filt(c, 'bandpass', 800 + p.tune * 1400, 0.8 + p.tone * 5), g = c.createGain(), sp = 0.006 + p.snap * 0.01;
    g.gain.setValueAtTime(0.0001, t);
    for (let i = 0; i < 3; i++) { const ts = t + i * sp; g.gain.setValueAtTime(v, ts); g.gain.exponentialRampToValueAtTime(v * 0.08, ts + sp * 0.9); }
    const tt = t + 3 * sp; g.gain.setValueAtTime(v * 0.9, tt); g.gain.exponentialRampToValueAtTime(0.0001, tt + 0.08 + p.decay * 0.5);
    n.connect(bp).connect(g).connect(o);
  },
  chat(c, o, t, v, p) { metal(c, o, t, v, p, 0.02 + p.decay * 0.14); },
  ohat(c, o, t, v, p) { metal(c, o, t, v, p, 0.12 + p.decay * 0.9); },
  tom(c, o, t, v, p) {
    const f = 70 + p.tune * 220, dec = 0.12 + p.decay * 0.7, os = c.createOscillator(), g = c.createGain();

    ad(g.gain, t, v, 0.002, dec); os.connect(g).connect(o); os.start(t); os.stop(t + dec + 0.05);

// ───────────────────────── app state ─────────────────────────
const LS = {
  get(k) { try { return localStorage.getItem(k); } catch (_) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (_) { return false; } },
};
function loadCur() { try { const j = LS.get('tiltseq.toy'); return j ? fixProject(JSON.parse(j)) : null; } catch (_) { return null; } }
let P = loadCur() || demoProject(0);
const S = { edit: 0, playing: false, steps: 0, demo: false };
const LIVE = { x: 0, y: 0 };
const TILT = { on: false, have: false, g: 0, b: 0, cg: 0, cb: 0, cal: false };
const flash = ROWS.map(() => new Float64Array(16).fill(-9));   // audio time each cell last fired
let E = null;
const queue = [];

function ensureAudio() {
  if (!AC) return null;
  if (!E) {
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (_) {}
    E = new Engine(new AC({ latencyHint: 'interactive' }), P, false);
    E.mod = liveMod;
  }
  if (E.c.state !== 'running') E.c.resume();

}
['pointerdown','touchend','keydown'].forEach(ev => document.addEventListener(ev, () => ensureAudio(), { capture: true, passive: true }));

let saveT = 0;
function dirty(sync) {
  if (sync && E) E.sync();
  clearTimeout(saveT); saveT = setTimeout(() => LS.set('tiltseq.toy', JSON.stringify(P)), 500);
}
function setProject(np) {
  const was = S.playing;
  if (was) stop();
  P = np; S.edit = 0;
  if (E) { E.P = P; E.loop = 0; E.queued = null; E.sync(); E.applyMaster(E.c.currentTime); }
  dirty(); render();
  if (was) play();
}
function setKit(k) {
  P.kit = k; P.tracks = kitTracks(k, P.tracks.map(t => t.pats), P.len);
  if (E) { E.pend = {}; E.sync(); }
  dirty(); render();
}

// ───────────────────────── transport ─────────────────────────
let timer = 0, nextT = 0, gStep = 0;
function play() {
  const e = ensureAudio(); if (!e) return;
  e.loop = S.edit; e.queued = null; gStep = 0; nextT = e.c.currentTime + 0.06; queue.length = 0;
  S.playing = true; clearInterval(timer); timer = setInterval(tick, 25); tick(); updHinge();
}
function tick() {
  const sd = E.sd();
  while (nextT < E.c.currentTime + 0.12) {
    E.scheduleStep(gStep, nextT);
    const c = E.cur;
    P.tracks.forEach((t, r) => { if (t.pats[c.loop][c.s]) flash[r][c.s] = c.t; });
    queue.push(Object.assign({}, c));
    if (queue.length > 64) queue.shift();
    nextT += sd; gStep++; S.steps++;

}
function stop() {
  clearInterval(timer); S.playing = false;
  if (E) E.releaseAll(E.c.currentTime);
  queue.length = 0; updHinge();
}
function nowStep() {
  if (!S.playing || !E) return null;
  const now = E.c.currentTime; let cur = null;
  for (const q of queue) if (q.t <= now) cur = q;
  return cur;
}

// ───────────────────────── loops ─────────────────────────
function selLoop(k) {
  S.edit = k;
  if (E) { if (S.playing) E.queued = k; else E.loop = k; }
  render();
}
function dupLoop() {
  if (P.len >= MAXL) return toast(MAXL + ' MAX');
  for (const t of P.tracks) t.pats.splice(S.edit + 1, 0, JSON.parse(JSON.stringify(t.pats[S.edit])));
  P.len++; dirty(); selLoop(S.edit + 1);
}
function clrLoop() { for (const t of P.tracks) t.pats[S.edit] = emptyLoop(); dirty(); render(); }
function delLoop() {
  if (P.len <= 1) return clrLoop();
  for (const t of P.tracks) t.pats.splice(S.edit, 1);
  P.len--; S.edit = Math.min(S.edit, P.len - 1);
  if (E && E.loop >= P.len) E.loop = 0;
  dirty(); render();
}

// ───────────────────────── tilt input ─────────────────────────
window.addEventListener('deviceorientation', e => {
  if (e.gamma == null) return;
  TILT.have = true;
  const ang = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
  let g = e.gamma, b = e.beta;
  if (ang === 90) { g = e.beta; b = -e.gamma; } else if (ang === -90 || ang === 270) { g = -e.beta; b = e.gamma; }
  TILT.g = g; TILT.b = b;
  if (TILT.on && !TILT.cal) { TILT.cg = g; TILT.cb = b; TILT.cal = true; }
});
function toggleTilt() {
  if (TILT.on) { TILT.on = false; LIVE.x = LIVE.y = 0; if (E) E.applyMaster(E.c.currentTime); updHinge(); return; }
  const DOE = window.DeviceOrientationEvent;
  const go = () => { TILT.on = true; TILT.cal = false; if (!TILT.have) toast('NO SENSOR'); updHinge(); };
  if (DOE && typeof DOE.requestPermission === 'function') DOE.requestPermission().then(r => r === 'granted' ? go() : toast('DENIED')).catch(() => toast('DENIED'));
  else go();
}
// tilt: X sweeps the DJ filter, Y brightens/darkens every melody + bass row
function liveMod(i) {
  if (!(TILT.on || S.demo)) return null;
  if (i === -1) return LIVE.x;
  return ROWS[i] && ROWS[i].kind !== 'drum' ? LIVE.y : null;
}


// ───────────────────────── files / export ─────────────────────────
function saveBlob(blob, name) {
  const u = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 60000);
}
function canShare(blob, name) {
  try { return !!(navigator.canShare && navigator.canShare({ files: [new File([blob], name, { type: blob.type })] })); } catch (_) { return false; }
}
function deliver(blob, name) {
  const isAudio = /^audio/.test(blob.type), url = isAudio ? URL.createObjectURL(blob) : '';
  const kb = blob.size > 1e6 ? (blob.size / 1e6).toFixed(1) + ' MB' : Math.ceil(blob.size / 1024) + ' KB';
  modal(`<h3>${name}</h3><div class="lbl">${kb}</div>${isAudio ? `<audio controls src="${url}"></audio>` : ''}
    <div class="row"><button class="b w on" data-m="save">SAVE</button>${canShare(blob, name) ? '<button class="b w" data-m="share">SHARE</button>' : ''}<button class="b" data-m="x">CLOSE</button></div>`, k => {
    if (k === 'save') saveBlob(blob, name);
    if (k === 'share') navigator.share({ files: [new File([blob], name, { type: blob.type })], title: name }).catch(() => {});
    if (k === 'x') { closeModal(); if (url) URL.revokeObjectURL(url); }
  });
}
function exportBeat() { deliver(new Blob([JSON.stringify({ fmt: 'tiltseq', kind: 'toy', v: 3, project: P })], { type: 'application/json' }), 'tilt-toy-' + Date.now().toString(36) + '.json'); }
function importText(txt) {
  let o; try { o = JSON.parse(txt); } catch (_) { return toast('BAD FILE'); }
  const np = fixProject(o && o.project ? o.project : o);
  if (!np) return toast('BAD FILE');
  setProject(np);
}
$('#fileIn').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(importText); e.target.value = '';
});
// renders the whole loop chain, repeated to at least 4 bars
async function renderAudio(reps) {
  if (!OAC) throw new Error('OFFLINE AUDIO UNSUPPORTED');
  reps = reps || Math.max(1, Math.ceil(4 / P.len));
  const sr = 44100, sd = 60 / P.bpm / 4, steps = P.len * 16 * reps, len = 0.05 + steps * sd + 2.5;
  const oc = new OAC(2, Math.ceil(len * sr), sr), eng = new Engine(oc, P, true);
  for (let g = 0; g < steps; g++) eng.scheduleStep(g, 0.05 + g * sd);
  eng.releaseAll(0.05 + steps * sd);
  const buf = await oc.startRendering();
  let peak = 0;
  for (let ch = 0; ch < buf.numberOfChannels; ch++) { const d = buf.getChannelData(ch); for (let i = 0; i < d.length; i++) { const a = Math.abs(d[i]); if (a > peak) peak = a; } }
  if (peak > 0.98) for (let ch = 0; ch < buf.numberOfChannels; ch++) { const d = buf.getChannelData(ch), k = 0.98 / peak; for (let i = 0; i < d.length; i++) d[i] *= k; }
  return buf;
}
async function doRender(fmt) {
  modal(`<h3>&#9203;</h3><div class="lbl" id="rprog"></div>`, () => {});
  try {
    const buf = await renderAudio(), prog = $('#rprog');
    const blob = fmt === 'mp3' ? await toMp3(buf, f => { if (prog) prog.textContent = Math.round(f * 100) + '%'; }) : toWav(buf);
    deliver(blob, 'tilt-toy.' + fmt);
  } catch (err) {
    modal(`<h3>${String(err.message || err).toUpperCase()}</h3><button class="b" data-m="x">OK</button>`, () => closeModal());
  }
}

  const ch = buf.numberOfChannels, n = buf.length, sr = buf.sampleRate, dv = new DataView(new ArrayBuffer(44 + n * ch * 2));
  const ws = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
  ws(0, 'RIFF'); dv.setUint32(4, 36 + n * ch * 2, true); ws(8, 'WAVE'); ws(12, 'fmt ');
  dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, ch, true); dv.setUint32(24, sr, true);
  dv.setUint32(28, sr * ch * 2, true); dv.setUint16(32, ch * 2, true); dv.setUint16(34, 16, true); ws(36, 'data'); dv.setUint32(40, n * ch * 2, true);
  const data = []; for (let c = 0; c < ch; c++) data.push(buf.getChannelData(c));
  let o = 44;
  for (let i = 0; i < n; i++) for (let c = 0; c < ch; c++) { const v = clamp(data[c][i], -1, 1); dv.setInt16(o, v < 0 ? v * 32768 : v * 32767, true); o += 2; }

}
// LAME (LGPL) is a separate file, loaded only when exporting MP3.
function loadLame() {
  if (window.lamejs) return Promise.resolve();
  const urls = ['vendor/lame.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js'];
  let i = 0;
  return new Promise((res, rej) => {
    const next = () => {
      if (i >= urls.length) return rej(new Error('MP3 ENCODER UNAVAILABLE'));
      const s = document.createElement('script'); s.src = urls[i++];
      s.onload = () => window.lamejs ? res() : next(); s.onerror = next;
      document.head.appendChild(s);
    };
    next();
  });
}
async function toMp3(buf, prog) {
  await loadLame();
  const enc = new window.lamejs.Mp3Encoder(2, buf.sampleRate, 192), L = buf.getChannelData(0), R = buf.numberOfChannels > 1 ? buf.getChannelData(1) : L;
  const blk = 1152 * 16, l16 = new Int16Array(blk), r16 = new Int16Array(blk), out = [];

  for (let i = 0, k = 0; i < L.length; i += blk, k++) {
    const n = Math.min(blk, L.length - i);
    for (let j = 0; j < n; j++) { l16[j] = i16(L[i + j]); r16[j] = i16(R[i + j]); }

// ───────────────────────── UI helpers ─────────────────────────
const panel = $('#panel');
let toastT = 0;
function toast(s) { const el = $('#status'); el.textContent = s; clearTimeout(toastT); toastT = setTimeout(() => el.textContent = '', 1600); }
function modal(html, on) {
  const m = $('#modal'); m.innerHTML = `<div class="mbox">${html}</div>`; m.hidden = false;
  m.onclick = e => { const b = e.target.closest('[data-m]'); if (b) on(b.dataset.m, b); else if (e.target === m) closeModal(); };
}
function closeModal() { $('#modal').hidden = true; $('#modal').innerHTML = ''; }

// ───────────────────────── hinge ─────────────────────────
const SPEED_LAB = ['&#9656;', '&#9656;&#9656;', '&#9656;&#9656;&#9656;'];
function updHinge() {
  $('#bPlay').innerHTML = S.playing ? '&#9632;' : '&#9654;';
  $('#bPlay').classList.toggle('on', S.playing);
  $('#bSpeed').innerHTML = SPEED_LAB[P.speed];
  $('#bKit').textContent = KITS[P.kit].name;
  $('#bTilt').classList.toggle('on', TILT.on);
}
$('#bPlay').onclick = () => S.playing ? stop() : play();
$('#bSpeed').onclick = () => { P.speed = (P.speed + 1) % SPEEDS.length; P.bpm = SPEEDS[P.speed]; if (E) E.sync(); dirty(); updHinge(); };
$('#bKit').onclick = () => { setKit((P.kit + 1) % KITS.length); if (!S.playing) preview(0); };
$('#bTilt').onclick = toggleTilt;
$('#bMenu').onclick = () => {
  modal(`<div class="mgrid">${DEMOS.map((d, i) => `<button class="b" data-m="demo" data-i="${i}">&#9835; ${i + 1}</button>`).join('')}</div>
    <div class="mgrid" style="grid-template-columns:1fr 1fr"><button class="b on" data-m="wav">WAV</button><button class="b on" data-m="mp3">MP3</button>
    <button class="b" data-m="out">SHARE</button><button class="b" data-m="in">OPEN</button></div>
    <div class="mgrid" style="grid-template-columns:1fr 1fr"><button class="b" data-m="new">NEW</button><button class="b" data-m="x">&#10005;</button></div>
    <div class="lbl" style="font-size:12px">MP3: LAME / LGPL</div>`, (k, b) => {
    if (k !== 'out' && k !== 'in') closeModal();
    if (k === 'demo') setProject(demoProject(+b.dataset.i));
    if (k === 'wav' || k === 'mp3') doRender(k);
    if (k === 'out') exportBeat();
    if (k === 'in') { closeModal(); $('#fileIn').click(); }
    if (k === 'new') setProject(mkProject(P.kit));
  });
};

// ───────────────────────── loop screen ─────────────────────────
function render() {
  if (S.edit >= P.len) S.edit = P.len - 1;
  let h = `<div class="row nw"><button class="b" data-a="lprev">&#9664;</button><button class="b pick" id="lpk">${S.edit + 1}/${P.len}</button><button class="b" data-a="lnext">&#9654;</button>
    <button class="b on" data-a="dup">DUP</button><button class="b" data-a="lclr">CLR</button><button class="b" data-a="ldel">DEL</button></div>`;
  for (const [kind, a, b] of SECTIONS) {
    h += `<div class="grid ga ${kind}" style="flex:${b - a} 1 0;min-height:0;grid-template-rows:repeat(${b - a},minmax(0,44px))">`;
    for (let r = a; r < b; r++) {
      h += `<div class="sw" data-p="sw" data-r="${r}"></div>`;
      P.tracks[r].pats[S.edit].forEach((v, s) => { h += `<div class="c${v ? ' on' : ''}${s % 4 === 0 ? ' q4' : ''}" data-s="${s}" data-r="${r}" data-p="cell"></div>`; });
    }
    h += `</div>`;
  }
  panel.innerHTML = h;
  phCells = [...panel.querySelectorAll('.c[data-s]')]; lastPh = -2; lastPl = -2;
  updHinge();
}
function preview(r) {
  const e = ensureAudio(); if (!e) return;
  const t = P.tracks[r];
  if (t.type === 'drum') e.hit(r); else e.noteOn(r, t.note, 0.75).release(e.c.currentTime + 0.25);
}
let paint = null;
function setCell(el, v) {
  const r = +el.dataset.r, s = +el.dataset.s, t = P.tracks[r];
  t.pats[S.edit][s] = v ? (t.type === 'drum' ? 1 : [t.note, 0, 0]) : 0;
  el.classList.toggle('on', !!v);
}
panel.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-p]'); if (!el) return;
  e.preventDefault();
  const r = +el.dataset.r;
  if (el.dataset.p === 'sw') { preview(r); return; }
  const v = P.tracks[r].pats[S.edit][+el.dataset.s] ? 0 : 1;
  setCell(el, v);
  if (v && !S.playing) preview(r);
  paint = { v, done: new Set([el]) };
  dirty();
});
panel.addEventListener('pointermove', e => {
  if (!paint) return;
  const el = document.elementFromPoint(e.clientX, e.clientY);
  if (el && el.dataset && el.dataset.p === 'cell' && !paint.done.has(el)) { paint.done.add(el); setCell(el, paint.v); dirty(); }
});
const panelUp = () => { paint = null; };
document.addEventListener('pointerup', panelUp); document.addEventListener('pointercancel', panelUp);
panel.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  ({ lprev: () => selLoop((S.edit + P.len - 1) % P.len), lnext: () => selLoop((S.edit + 1) % P.len),
     dup: dupLoop, lclr: clrLoop, ldel: delLoop })[el.dataset.a]();
});


// ───────────────────────── top screen (LCD) ─────────────────────────
const cv = $('#top'), g2 = cv.getContext('2d');
let TW = 240, TH = 144;
const COL = { bg:'#0b130d', dim:'#1d3622', mid:'#2f5a35', ink:'#9cf06a', am:'#ffb347', cy:'#6ad6f0', rd:'#ff4a3a', or:'#ff6a13', wh:'#e8ffd0' };
function fitTop() {
  const wrap = $('#topscr'), dpr = window.devicePixelRatio || 1;
  // whole device pixels per LCD pixel; the LCD's logical size flexes (~240 wide) so it fills the screen
  const dw = Math.round(wrap.clientWidth * dpr), dh = Math.round(wrap.clientHeight * dpr), k = Math.max(1, Math.round(dw / 240));
  TW = Math.max(236, Math.floor(dw / k)); TH = Math.max(120, Math.floor(dh / k));
  cv.width = TW; cv.height = TH; g2.imageSmoothingEnabled = false;
  cv.style.width = (TW * k / dpr) + 'px'; cv.style.height = (TH * k / dpr) + 'px';
}
window.addEventListener('resize', fitTop);
const scopeBuf = new Uint8Array(256);
const SEC_COL = { mel: COL.cy, bass: COL.am, drum: COL.ink };
function drawTop() {
  g2.fillStyle = COL.bg; g2.fillRect(0, 0, TW, TH);
  const cur = nowStep(), L = cur ? cur.loop : S.edit, ps = cur ? cur.s : -1, now = E ? E.c.currentTime : 0;
  // loop pips: one per loop, the playing one lit
  for (let l = 0; l < P.len; l++) {
    g2.fillStyle = l === L ? COL.or : l === S.edit ? COL.wh : COL.mid;
    g2.fillRect(3 + (l % 40) * 6, 3 + Math.floor(l / 40) * 6, 4, 4);
  }
  // light show: cells glow when they fire, then fade
  const sy = TH - 34, sh = 30, top = 12, x0 = 3, cw = Math.floor((TW - 6) / 16), avail = sy - top - 8, rh = Math.max(3, Math.floor(avail / ROWS.length));
  let y = top;
  ROWS.forEach((row, r) => {
    if (r === 6 || r === 9) y += 3;
    const col = SEC_COL[row.kind], pat = P.tracks[r].pats[L] || [];
    for (let s = 0; s < 16; s++) {
      const x = x0 + s * cw, age = now - flash[r][s];
      if (pat[s]) {
        g2.fillStyle = S.playing && age >= 0 && age < 0.18 ? COL.wh : col;
        g2.globalAlpha = S.playing && !(age >= 0 && age < 0.18) ? 0.55 : 1;
        g2.fillRect(x, y, cw - 2, rh - 1);
        g2.globalAlpha = 1;
      } else { g2.fillStyle = s === ps ? COL.mid : COL.dim; g2.fillRect(x + (cw >> 1) - 1, y + (rh >> 1), 2, 1); }
    }
    y += rh;
  });
  if (ps >= 0) { g2.fillStyle = COL.or; g2.fillRect(x0 + ps * cw, y + 2, cw - 2, 2); }
  // scope
  const sw = TW - 56;
  g2.fillStyle = COL.dim; g2.fillRect(2, sy, sw + 2, sh); g2.fillStyle = COL.bg; g2.fillRect(3, sy + 1, sw, sh - 2);
  if (E && E.an) {
    E.an.getByteTimeDomainData(scopeBuf);
    g2.fillStyle = COL.ink;
    for (let x = 0; x < sw; x++) { const v = scopeBuf[Math.floor(x / sw * 256)]; g2.fillRect(3 + x, sy + 1 + Math.round((255 - v) / 255 * (sh - 3)), 1, 1); }
  }
  // tilt box
  const bx = TW - 50, bw = 48, on = TILT.on || S.demo;
  g2.fillStyle = COL.dim; g2.fillRect(bx, sy, bw, sh); g2.fillStyle = COL.bg; g2.fillRect(bx + 1, sy + 1, bw - 2, sh - 2);
  g2.fillStyle = COL.mid; g2.fillRect(bx + bw / 2, sy + 1, 1, sh - 2); g2.fillRect(bx + 1, sy + sh / 2, bw - 2, 1);
  g2.fillStyle = on ? COL.or : COL.mid;
  g2.fillRect(Math.round(bx + bw / 2 + LIVE.x * (bw / 2 - 3)) - 2, Math.round(sy + sh / 2 - LIVE.y * (sh / 2 - 3)) - 2, 4, 4);
}

// ───────────────────────── frame loop ─────────────────────────
let phCells = [], lastPh = -2, lastPl = -2, demoT = 0, demoI = 0, wasLive = false;
function frame(ts) {
  if (S.demo) { LIVE.x = Math.sin(ts / 1300) * 0.7; LIVE.y = Math.sin(ts / 2100) * 0.5; }
  else if (TILT.on && TILT.have) {
    const tx = clamp((TILT.g - TILT.cg) / 30, -1, 1), ty = clamp(-(TILT.b - TILT.cb) / 30, -1, 1);
    LIVE.x += (tx - LIVE.x) * 0.35; LIVE.y += (ty - LIVE.y) * 0.35;
  }
  const live = TILT.on || S.demo;
  if (E && (live || wasLive)) E.applyMaster(E.c.currentTime);
  wasLive = live;
  const cur = nowStep(), ph = cur && cur.loop === S.edit ? cur.s : -1, pl = cur ? cur.loop : -1;
  if (ph !== lastPh) { for (const c of phCells) c.classList.toggle('ph', +c.dataset.s === ph); lastPh = ph; }
  if (pl !== lastPl) { const b = $('#lpk'); if (b) b.classList.toggle('pl', pl === S.edit); lastPl = pl; }
  if (S.demo) {
    if (!demoT) demoT = ts;
    if (ts - demoT > 9000) { demoT = ts; demoI = (demoI + 1) % DEMOS.length; setProject(demoProject(demoI)); if (!S.playing) play(); }
  }
  drawTop();
  requestAnimationFrame(frame);
}

// ───────────────────────── boot ─────────────────────────
fitTop(); render();
requestAnimationFrame(frame);
document.addEventListener('visibilitychange', () => { if (document.hidden) LS.set('tiltseq.toy', JSON.stringify(P)); });

// demo hook for the AI tester
window.__tiltseq = {
  setDemo(on) {
    S.demo = !!on;
    if (on) { demoI = 0; demoT = 0; setProject(demoProject(0)); play(); } else stop();
  },
  startDemo() { this.setDemo(true); },
  stopDemo() { this.setDemo(false); },
  state() { return { score: S.steps, mode: P.name, playing: S.playing, loops: P.len, audio: E ? E.c.state : 'none' }; },
  render: async () => { const b = await renderAudio(); let pk = 0, ss = 0; const d = b.getChannelData(0); for (let i = 0; i < d.length; i++) { pk = Math.max(pk, Math.abs(d[i])); ss += d[i] * d[i]; } return { len: b.length, peak: pk, rms: Math.sqrt(ss / d.length) }; },
  wav: async () => toWav(await renderAudio()).size,
  mp3: async () => (await toMp3(await renderAudio(), () => {})).size,
  load: i => setProject(demoProject(i)), kit: setKit,
  importText, get P() { return P; }, S, DEMOS, KITS,
};
if (new URLSearchParams(location.search).get('demo') === '1') window.__tiltseq.setDemo(true);

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => r.update()).catch(() => {});
}
})();
</script>
